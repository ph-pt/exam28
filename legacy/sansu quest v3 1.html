<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>しゃかいクエスト</title>
<style>
  :root{
    --ink:#26324B;
    --paper:#EEF4FB;
    --card:#FFFFFF;
    --orange:#FF8A3D;
    --orange-deep:#F0742A;
    --mint:#2FBF8F;
    --coral:#F26D6D;
    --star:#FFC53D;
    --sky:#5AA9E6;
    --line:#D9E4F0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","BIZ UDGothic","Yu Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex; justify-content:center;
    min-height:100%;
    -webkit-user-select:none; user-select:none;
  }
  #app{width:100%; max-width:720px; padding:20px 18px 30px; display:flex; flex-direction:column; min-height:100vh;}

  .warn-banner{background:#FFF3E6; border:2px solid var(--orange); border-radius:14px; padding:10px 14px; font-size:13px; margin-bottom:14px; line-height:1.6;}

  /* ---------- home ---------- */
  .home-title{ text-align:center; font-size:32px; font-weight:800; letter-spacing:1px; margin:10px 0 4px; }
  .home-sub{text-align:center; font-size:14px; color:#5B6B87; margin-bottom:20px;}

  .map-card{
    background:var(--card); border-radius:22px; padding:20px 20px 18px; margin-bottom:18px;
    box-shadow:0 5px 0 var(--line);
  }
  .map-label{font-size:12.5px; color:#8896AC; font-weight:700; margin-bottom:6px;}
  .map-here{display:flex; align-items:center; gap:12px;}
  .map-emoji{font-size:42px; flex-shrink:0;}
  .map-name{font-size:22px; font-weight:800;}
  .map-progress-wrap{margin-top:14px;}
  .map-bar-track{background:#EAF1FA; border-radius:999px; height:12px; overflow:hidden;}
  .map-bar-fill{background:linear-gradient(90deg, var(--sky), var(--mint)); height:100%; border-radius:999px; transition:width .4s;}
  .map-progress-text{font-size:12px; color:#8896AC; margin-top:6px; display:flex; justify-content:space-between;}
  .map-goal{font-size:13px; color:var(--orange-deep); font-weight:700; margin-top:8px; text-align:center;}

  .code-card{ background:var(--card); border-radius:20px; padding:16px 18px; margin-bottom:16px; box-shadow:0 4px 0 var(--line); }
  .code-label{font-size:13.5px; font-weight:700; margin-bottom:8px;}
  .code-row{display:flex; gap:8px;}
  .code-input{
    flex:1; font-family:inherit; font-size:15px; padding:10px 12px; border-radius:12px;
    border:2px solid var(--line); background:#F8FAFD; color:var(--ink); letter-spacing:1px;
  }
  .code-btn{
    font-family:inherit; font-size:14px; font-weight:800; padding:10px 16px; border:none;
    border-radius:12px; background:var(--sky); color:#fff; cursor:pointer; box-shadow:0 3px 0 #3E86BD;
  }
  .code-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #3E86BD;}
  .code-msg{font-size:13px; margin-top:8px; line-height:1.6;}
  .code-msg.ok{color:#159A6E;} .code-msg.ng{color:#D64F4F;}

  .start-btn{
    display:block; width:100%; background:var(--orange); color:#fff; border:none;
    border-radius:22px; padding:20px 22px; margin-bottom:14px; text-align:center;
    box-shadow:0 5px 0 var(--orange-deep); cursor:pointer;
    font-family:inherit; font-size:22px; font-weight:800; letter-spacing:1px;
    transition:transform .08s;
  }
  .start-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--orange-deep);}
  .start-sub{font-size:13px; color:#5B6B87; text-align:center; margin-top:-6px; margin-bottom:14px;}
  .home-note{font-size:12px; color:#8896AC; text-align:center; margin-top:auto; padding-top:20px; line-height:1.7;}
  .parent-menu-row{text-align:center; padding-top:14px;}
  .parent-menu-btn{background:none; border:none; color:#B8C4D6; font-size:11.5px; font-family:inherit; padding:8px; cursor:pointer; text-decoration:underline;}
  .bank-paste{
    width:100%; font-family:ui-monospace,monospace; font-size:12.5px; line-height:1.5; padding:10px 12px;
    border-radius:12px; border:2px solid var(--line); background:#F8FAFD; color:var(--ink); resize:vertical;
  }
  .bank-file{width:100%; font-family:inherit; font-size:14px; padding:10px;
    background:#F4F8FD; border:2px dashed var(--sky); border-radius:12px;}
  .reset-bank-btn{
    display:block; width:100%; margin-top:14px; background:var(--card); color:var(--ink); border:none;
    border-radius:16px; padding:15px 0; font-family:inherit; font-size:15px; font-weight:800;
    box-shadow:0 4px 0 var(--line); cursor:pointer;
  }
  .reset-bank-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}

  .doors-label{font-size:14px; font-weight:800; color:#5B6B87; margin:2px 0 10px; text-align:center;}
  .stage-btn{
    display:block; width:100%; background:var(--card); border:none;
    border-radius:20px; padding:16px 20px; margin-bottom:12px; text-align:left;
    box-shadow:0 4px 0 var(--line); cursor:pointer;
    font-family:inherit; color:var(--ink); transition:transform .08s;
  }
  .stage-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}
  .stage-btn .stage-name{font-size:19px; font-weight:800;}
  .stage-btn .stage-desc{font-size:13px; color:#5B6B87; margin-top:4px;}
  .stage-btn.omakase{background:#FFF3E6;}

  /* ---------- quiz ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .quit-btn{background:none; border:none; font-size:14px; color:#8896AC; font-family:inherit; padding:6px 4px; cursor:pointer; flex-shrink:0;}
  .journey-mini{flex:1; display:flex; align-items:center; gap:6px;}
  .journey-mini .em{font-size:16px;}
  .journey-mini-track{flex:1; background:#DCE7F5; border-radius:999px; height:7px; overflow:hidden;}
  .journey-mini-fill{background:var(--mint); height:100%; border-radius:999px; transition:width .5s;}
  .combo{font-size:13px; font-weight:800; color:var(--orange-deep); min-width:70px; text-align:right; flex-shrink:0;}

  .rail{display:flex; gap:5px; justify-content:center; margin-bottom:10px; flex-wrap:wrap;}
  .rail span{font-size:16px; filter:grayscale(1) opacity(.35); transition:filter .3s, transform .3s;}
  .rail span.on{filter:none; transform:scale(1.15);}
  .rail span.ng{filter:grayscale(1) opacity(.8);}

  .revenge-badge{
    display:inline-block; background:var(--coral); color:#fff; font-size:12.5px; font-weight:800;
    border-radius:999px; padding:4px 12px; margin-bottom:8px;
  }

  .qcard{
    background:var(--card); border-radius:24px; padding:24px 22px;
    box-shadow:0 5px 0 var(--line);
  }
  .qnum{font-size:13px; font-weight:700; color:var(--sky); margin-bottom:8px;}
  .qtext{font-size:21px; line-height:1.7; font-weight:600; min-height:3.4em;}
  .write-tip{font-size:12.5px; color:#8896AC; margin-top:10px;}

  .answer-row{display:flex; align-items:center; gap:10px; margin:18px 0 4px;}
  .answer-box{
    flex:1; font-size:28px; font-weight:800; text-align:center;
    background:#F4F8FD; border:2px dashed var(--sky); border-radius:14px;
    min-height:58px; display:flex; align-items:center; justify-content:center;
    letter-spacing:1px; overflow:hidden;
  }
  .answer-box.filled{border-style:solid;}
  input.answer-box{
    display:block; text-align:center; padding:0 16px; font-family:inherit;
    -webkit-appearance:none; appearance:none;
  }
  input.answer-box.answer-input{ text-align:left; }
  input.answer-box:disabled{opacity:.7;}
  input.answer-box::placeholder{font-size:15px; font-weight:600; color:#A9B7CC;}
  .unit{font-size:16px; color:#5B6B87; font-weight:700; min-width:2em;}

  .hint-area{margin-top:12px;}
  .hint-btn{
    background:#FFF3E6; color:var(--orange-deep); border:none; border-radius:999px;
    font-family:inherit; font-size:14.5px; font-weight:700; padding:10px 18px; cursor:pointer;
  }
  .hint-bubble{
    background:#FFF9EF; border-left:5px solid var(--star); border-radius:0 12px 12px 0;
    padding:10px 14px; margin-top:8px; font-size:15px; line-height:1.6;
  }

  /* keypad */
  .keypad{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px;}
  .key{
    font-family:inherit; font-size:26px; font-weight:800; color:var(--ink);
    background:var(--card); border:none; border-radius:16px; padding:16px 0;
    box-shadow:0 4px 0 var(--line); cursor:pointer; transition:transform .06s;
  }
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}
  .key.fn{background:#E7EFF9; font-size:20px;}
  .key.go{
    grid-column:span 2; background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-deep);
    font-size:22px; letter-spacing:2px;
  }
  .key.go:disabled{opacity:.45;}

  /* feedback */
  .fb{
    margin-top:16px; border-radius:18px; padding:16px 18px; font-size:16px; line-height:1.65;
    animation:pop .25s;
  }
  @keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
  .fb.ok{background:#E4F8F0; border:2px solid var(--mint);}
  .fb.ng{background:#FDECEC; border:2px solid var(--coral);}
  .fb .fb-head{font-size:20px; font-weight:800; margin-bottom:6px;}
  .fb.ok .fb-head{color:#159A6E;} .fb.ng .fb-head{color:#D64F4F;}
  .next-btn{
    display:block; width:100%; margin-top:14px;
    background:var(--sky); color:#fff; border:none; border-radius:16px;
    font-family:inherit; font-size:19px; font-weight:800; padding:15px 0;
    box-shadow:0 4px 0 #3E86BD; cursor:pointer;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #3E86BD;}

  /* ---------- result ---------- */
  .res-head{text-align:center; margin:18px 0 10px;}
  .res-emoji{font-size:52px;}
  .res-title{font-size:24px; font-weight:800; margin-top:8px;}
  .res-score{text-align:center; font-size:18px; margin-bottom:6px;}
  .res-score b{font-size:34px; color:var(--orange-deep);}
  .res-stars{text-align:center; font-size:26px; letter-spacing:4px; margin-bottom:14px;}

  .journey-card{
    background:var(--card); border-radius:20px; padding:18px 20px; margin-bottom:16px; box-shadow:0 4px 0 var(--line);
    text-align:center;
  }
  .journey-move{font-size:14px; color:#5B6B87; margin-bottom:8px;}
  .journey-nodes{display:flex; align-items:center; justify-content:center; gap:10px; font-size:30px;}
  .journey-arrow{font-size:18px; color:#8896AC;}
  .journey-newname{font-size:15px; font-weight:800; margin-top:6px;}

  .title-badge{
    display:inline-block; background:linear-gradient(135deg,var(--star),var(--orange)); color:#fff;
    font-size:14px; font-weight:800; border-radius:999px; padding:8px 18px; margin:4px 4px 12px;
    box-shadow:0 3px 0 var(--orange-deep);
  }
  .title-wrap{text-align:center;}

  .review-head{font-size:15px;font-weight:700;margin:8px 0 10px;}
  .review{background:var(--card); border-radius:18px; padding:16px 18px; margin-bottom:12px; box-shadow:0 4px 0 var(--line);}
  .review .rq{font-size:14.5px; font-weight:700; line-height:1.6;}
  .review .ra{font-size:14px; margin-top:6px; line-height:1.6;}
  .review .ra b{color:#159A6E;}
  .review .ra .miss{color:#D64F4F; font-weight:700;}

  .savecode-card{
    background:#2A3550; color:#fff; border-radius:20px; padding:20px; margin:16px 0; text-align:center;
  }
  .savecode-label{font-size:13px; opacity:.8; margin-bottom:8px;}
  .savecode-text{
    font-size:19px; font-weight:800; letter-spacing:1px; word-break:break-all;
    background:rgba(255,255,255,.12); border-radius:12px; padding:12px 14px; margin-bottom:8px;
  }
  .savecode-note{font-size:12.5px; opacity:.85; line-height:1.6;}

  .res-btns{display:flex; gap:12px; margin-top:16px;}
  .res-btns button{
    flex:1; font-family:inherit; font-size:17px; font-weight:800; padding:15px 0;
    border:none; border-radius:16px; cursor:pointer;
  }
  .retry{background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-deep);}
  .gohome{background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important; transition:none!important;}
  }
</style>
</head>

<div id="app"></div>
<script>

// 全ての正答候補が数値/分数のときだけ数字。それ以外(漢字・かな回答)はテキスト判定
// (isNumericQuestionの実体は後方で定義。関数宣言なのでホイスティングによりここから参照可)
function validateBankPaste(text){
  let candidate;
  try{ candidate = JSON.parse(text); }
  catch(e){ return { ok:false, reason:"JSONとして読み取れませんでした。貼り付け内容を確認してください。" }; }

  if(!candidate || !Array.isArray(candidate.questions) || candidate.questions.length===0){
    return { ok:false, reason:"questions配列が見つかりません。" };
  }
  if(candidate.subject !== BUILTIN_BANK.subject){
    return { ok:false, reason:`subjectが一致しません(このアプリは "${BUILTIN_BANK.subject}" 用です)。` };
  }
  const idRe = new RegExp("^" + BUILTIN_BANK.subject + "\\d{4}$");
  const ids = candidate.questions.map(q=>q && q.id);
  for(const q of candidate.questions){
    if(!q || !q.id || !idRe.test(q.id)){
      return { ok:false, reason:`不正なid形式があります: ${q && q.id}` };
    }
    if(!q.cat){
      return { ok:false, reason:`catが未設定の問題があります(id: ${q.id})。` };
    }
    if(!Array.isArray(q.ans) || q.ans.length===0){
      return { ok:false, reason:`ansが未設定の問題があります(id: ${q.id})。` };
    }
    if(!isNumericQuestion(q) && q.ans.length<2){
      return { ok:false, reason:`テキスト回答は漢字+ひらがな等、2種類以上のans表記が必要です(id: ${q.id})。` };
    }
  }
  const idSet = new Set(ids);
  if(idSet.size !== ids.length){
    return { ok:false, reason:"idが重複しています。" };
  }
  const existingIds = ALL_QS.map(q=>q.id);
  const missing = existingIds.filter(id=>!idSet.has(id));
  if(missing.length){
    return { ok:false, reason:`既存のidが欠落しています(削除は禁止・外したい場合はretiredで対応): ${missing.slice(0,5).join("、")}${missing.length>5?" 他":""}` };
  }
  const numSuffix = id => parseInt(id.slice(BUILTIN_BANK.subject.length), 10);
  const existingMax = existingIds.length ? Math.max(...existingIds.map(numSuffix)) : 0;
  const newIds = ids.filter(id=>!existingIds.includes(id));
  const badNew = newIds.filter(id=>numSuffix(id) <= existingMax);
  if(badNew.length){
    return { ok:false, reason:`新規idは既存の続き番号にしてください(番号が既存以下のid: ${badNew.slice(0,5).join("、")})。` };
  }
  return { ok:true, bank:candidate };
}

/* ---------- Base32 セーブコード(V2: バンク成長対応 / V1: 旧形式の互換読み込み) ---------- */
const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function bitsFromInt(n, len){ return (n>>>0).toString(2).padStart(len, "0"); }

function checksum(str){
  let sum = 0;
  for(const ch of str) sum += ch.charCodeAt(0);
  return B32[sum % 32];
}
function pad2(n){ return String(n).padStart(2,"0"); }
function todayDateStr(){
  const d = new Date();
  return pad2(d.getFullYear()%100) + pad2(d.getMonth()+1) + pad2(d.getDate());
}
function parseDateStr(dateStr){
  const yy = parseInt(dateStr.slice(0,2),10), mm = parseInt(dateStr.slice(2,4),10)-1, dd = parseInt(dateStr.slice(4,6),10);
  if(mm<0||mm>11||dd<1||dd>31) return null;
  return new Date(2000+yy, mm, dd);
}

// --- V1形式(問題数を固定前提。旧コードの互換読み込み専用。新規発行はしない) ---
function packStateV1(boxes, xp){
  let bits = "";
  ALL_QS.forEach(q=>{ bits += bitsFromInt(boxes[q.id] ?? 2, 2); });
  bits += bitsFromInt(Math.min(xp, 4095), 12);
  while(bits.length % 5 !== 0) bits += "0";
  let out = "";
  for(let i=0;i<bits.length;i+=5){ out += B32[parseInt(bits.substr(i,5),2)]; }
  return out;
}
function unpackStateV1(str){
  let bits = "";
  for(const ch of str.toUpperCase()){
    const idx = B32.indexOf(ch);
    if(idx < 0) throw new Error("invalid char");
    bits += bitsFromInt(idx, 5);
  }
  const needed = ALL_QS.length*2 + 12;
  if(bits.length < needed) throw new Error("too short");
  bits = bits.slice(0, needed);
  const boxes = {};
  ALL_QS.forEach((q,i)=>{ boxes[q.id] = parseInt(bits.substr(i*2,2),2); });
  const xp = parseInt(bits.substr(ALL_QS.length*2, 12), 2);
  return { boxes, xp };
}

// --- V2形式(問題数を10bitで持つ。バンクが増えても古いコードを壊さない) ---
function packStateV2(boxes, xp){
  const n = ALL_QS.length;
  let bits = bitsFromInt(n, 10);
  ALL_QS.forEach(q=>{ bits += bitsFromInt(boxes[q.id] ?? 2, 2); });
  bits += bitsFromInt(Math.min(xp, 4095), 12);
  while(bits.length % 5 !== 0) bits += "0";
  let out = "";
  for(let i=0;i<bits.length;i+=5){ out += B32[parseInt(bits.substr(i,5),2)]; }
  return out;
}
function unpackStateV2(str){
  let bits = "";
  for(const ch of str.toUpperCase()){
    const idx = B32.indexOf(ch);
    if(idx < 0) throw new Error("invalid char");
    bits += bitsFromInt(idx, 5);
  }
  if(bits.length < 10) throw new Error("too short");
  const n = parseInt(bits.substr(0,10), 2);
  const needed = 10 + n*2 + 12;
  if(bits.length < needed) throw new Error("too short");
  bits = bits.slice(0, needed);
  const codeBoxes = [];
  for(let i=0;i<n;i++) codeBoxes.push(parseInt(bits.substr(10+i*2,2),2));
  const xp = parseInt(bits.substr(10+n*2,12), 2);
  return { n, codeBoxes, xp };
}
// V2のcodeBoxes(コード作成時点でのid昇順n件)を、現在のALL_QSへ写像。
// 増えた分(現在の問題数 - n)は箱2(未出題)で初期化 = バンクが育っても進捗が消えない
function applyV2Code(decoded){
  if(decoded.n > ALL_QS.length) return { error: "bank_old" };
  const boxes = {};
  ALL_QS.forEach((q,i)=>{ boxes[q.id] = i < decoded.n ? decoded.codeBoxes[i] : 2; });
  return { boxes, xp: decoded.xp };
}

function makeSaveCode(boxes, xp){
  const state = packStateV2(boxes, xp);
  const chk = checksum(state);
  return `V2-${todayDateStr()}-${state}${chk}`;
}

function parseSaveCode(raw){
  const code = (raw||"").trim().toUpperCase();

  let m = code.match(/^V2-(\d{6})-([A-Z2-7]+)$/);
  if(m){
    const dateStr = m[1], body = m[2];
    if(body.length < 2) return null;
    const state = body.slice(0,-1), chk = body.slice(-1);
    if(checksum(state) !== chk) return null;
    let decoded;
    try{ decoded = unpackStateV2(state); }catch(e){ return null; }
    const applied = applyV2Code(decoded);
    if(applied.error) return { error: applied.error };
    const savedDate = parseDateStr(dateStr);
    if(!savedDate) return null;
    return { boxes: applied.boxes, xp: applied.xp, savedDate, version: "V2" };
  }

  // 旧V1コードの互換読み込み(バンク更新前に発行されたコードの移行用)。
  // 現在の問題数を前提にチェックサム照合するベストエフォート方式(仕様上の既定動作)
  m = code.match(/^V1-(\d{6})-([A-Z2-7]+)$/);
  if(m){
    const dateStr = m[1], body = m[2];
    if(body.length < 2) return null;
    const state = body.slice(0,-1), chk = body.slice(-1);
    if(checksum(state) !== chk) return null;
    let decoded;
    try{ decoded = unpackStateV1(state); }catch(e){ return null; }
    const savedDate = parseDateStr(dateStr);
    if(!savedDate) return null;
    return { boxes: decoded.boxes, xp: decoded.xp, savedDate, version: "V1" };
  }

  return null;
}

/* ---------- ライトナー式 復習スケジュール ---------- */
const INTERVAL_DAYS = {0:0, 1:3, 2:7, 3:21};
function daysSince(savedDate){
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(savedDate.getFullYear(), savedDate.getMonth(), savedDate.getDate());
  return Math.floor((a-b) / 86400000);
}
function isDue(box, ds){ return ds >= (INTERVAL_DAYS[box] ?? 0); }

function shuffle(arr){
  const b=[...arr];
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

function buildSession(boxes, savedDate, cat){
  const ds = daysSince(savedDate);
  const inCat = q => !cat || q.cat === cat;
  const pool0=[], due1=[], due2=[], due3=[];
  LIVE_QS.forEach(q=>{
    const box = boxes[q.id] ?? 2;
    if(box === 0) pool0.push(q);                       // リベンジは間口に関係なく候補
    else if(box === 1 && isDue(1, ds) && inCat(q)) due1.push(q);
    else if(box === 2 && isDue(2, ds) && inCat(q)) due2.push(q);
    else if(box === 3 && isDue(3, ds) && inCat(q)) due3.push(q); // 定着問題も21日で再出題
  });
  // リベンジ(箱0)は必ず混ぜる: 間口選択時は最大2、おまかせ時は最大4
  const revCap = cat ? 2 : 4;
  const review = [...shuffle(pool0).slice(0, revCap), ...shuffle(due1), ...shuffle(due2), ...shuffle(due3)].slice(0, 4);
  const revengeIds = new Set(pool0.map(q=>q.id));
  const usedIds = new Set(review.map(q=>q.id));
  const catPool = shuffle(LIVE_QS.filter(q=>!usedIds.has(q.id) && inCat(q)));
  const anyPool = shuffle(LIVE_QS.filter(q=>!usedIds.has(q.id) && !inCat(q)));
  const needed = Math.max(0, 8 - review.length);
  const fill = [...catPool, ...anyPool].slice(0, needed); // 間口内で足りなければ全体から補完
  const session = shuffle([...review, ...fill]).map(q=>({...q, _revenge: revengeIds.has(q.id)}));
  return session;
}

/* ---------- 入力モード判定・正規化(答え合わせ用) ---------- */
// 全ての正答候補が数値/分数のときだけ数字キーパッドモード。それ以外(漢字・かな回答)はテキスト入力モード
function isNumericQuestion(q){
  return q.ans.every(a => /^-?\d+(\.\d+)?$/.test(a) || /^\d+\/\d+$/.test(a));
}
function normZen(s){
  return s.replace(/[０-９．／]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}
function norm(s, numeric){
  const z = normZen(s);
  if(numeric){
    return z.replace(/[\s。、点円個こ回人gkmcページ]/g,"").trim();
  }
  // テキストモード: 空白・句読点を除去し、カタカナ→ひらがなに折り畳んで比較
  // (「すいさんかカルシウム」のようなかな交じり入力を正解にするため。答え側にも同じ正規化がかかる)
  return z.replace(/[\s。、！？]/g,"")
          .replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
          .trim();
}

/* ---------- 称号判定 ---------- */
function condMet(cond, stats, totalXp){
  if(cond.startsWith("noHintStreak")) return stats.noHintMaxStreak >= parseInt(cond.replace("noHintStreak",""),10);
  if(cond.startsWith("hintCorrect")) return stats.hintCorrectCount >= parseInt(cond.replace("hintCorrect",""),10);
  if(cond === "revengeWin") return stats.revengeWin;
  if(cond === "perfectStage") return stats.perfectStage;
  if(cond.startsWith("totalCorrect")) return totalXp >= parseInt(cond.replace("totalCorrect",""),10);
  return false;
}

/* ---------- マップ計算 ---------- */
function nodeIndexForXp(xp){
  const nodes = SKIN.map.nodes;
  const step = SKIN.map.stepPerCorrect || 1;
  return Math.min(Math.floor(xp / step), nodes.length - 1);
}

// キーパッドのタップは実際の<input>の値を書き換える(PCからの直接タイプと同じ経路に統一)
function tapKey(k){
  if(quiz.answered) return;
  const input = document.getElementById("ansbox");
  if(k==="⌫") input.value = input.value.slice(0,-1);
  else if(input.value.length<8) input.value += k;
  quiz.input = input.value;
  updateAns();
}

function updateAns(){
  const box = document.getElementById("ansbox");
  if(!box) return;
  box.classList.toggle("filled", !!quiz.input);
  box.disabled = quiz.answered;
  if(quiz.numeric){
    const go = document.getElementById("gobtn");
    if(go) go.disabled = !quiz.input || quiz.answered;
  } else {
    const btn = document.getElementById("submitBtn");
    if(btn) btn.disabled = !quiz.input || !quiz.input.trim() || quiz.answered;
  }

function showHint(){
  const q = quiz.qs[quiz.idx];

  quiz.hint++;
  const bubbles = [];
  if(quiz.hint>=1) bubbles.push(`<div class="hint-bubble">💡 <b>考え方</b>: ${q.h1}</div>`);
  if(quiz.hint>=2) bubbles.push(`<div class="hint-bubble">🧮 <b>式</b>: ${q.h2}</div>`);

  area.innerHTML = bubbles.join("") + (btnLabel?`<div style="margin-top:8px"><button class="hint-btn" id="hintbtn">${btnLabel}</button></div>`:"");
  const nb = document.getElementById("hintbtn");
  if(nb) nb.addEventListener("click", showHint);
}

function check(){
  const s = quiz, q = s.qs[s.idx];
  if(s.answered || !s.input) return;
  s.answered = true;
  const numeric = isNumericQuestion(q);
  const okSet = new Set(q.ans.map(a=>norm(a, numeric)));
  const ok = okSet.has(norm(s.input, numeric));
  s.results.push({q, ok, my:s.input, hintUsed:s.hint});

  // ライトナー箱の更新
  const curBox = G.boxes[q.id] ?? 2;
  G.boxes[q.id] = ok ? Math.min(curBox+1, 3) : 0;
  if(ok) G.xp = Math.min(G.xp+1, 4095);

  // セッション内スタッツ
  if(ok){
    s.combo++; s.best=Math.max(s.best,s.combo);
    if(s.hint===0){ s.noHintStreak++; s.noHintMaxStreak=Math.max(s.noHintMaxStreak, s.noHintStreak); }
    else { s.noHintStreak=0; s.hintCorrectCount++; }
    if(q._revenge) s.revengeWin = true;
  } else {
    s.combo=0; s.noHintStreak=0;
  }

  const fb = document.getElementById("fbarea");
  const last = s.idx === s.qs.length-1;
  if(ok){
    const p = SKIN.praise[Math.floor(Math.random()*SKIN.praise.length)];

  }else{
    const c = SKIN.cheer[Math.floor(Math.random()*SKIN.cheer.length)];
    fb.innerHTML = `<div class="fb ng"><div class="fb-head">❌ ざんねん…</div>
      正解は <b>${q.ans[0]}${q.unit_label||""}</b>。<br>📖 ${q.exp}<br>${c}
      <button class="next-btn" id="next">${last?"けっかを見る 🏁":"つぎの問題へ ▶"}</button></div>`;
  }
  updateAns();
  document.getElementById("next").addEventListener("click", ()=>{
    if(last) renderResult();
    else { s.idx++; s.input=""; s.hint=0; s.answered=false; renderQ(); }
  });
  fb.scrollIntoView({behavior:"smooth", block:"end"});
}

  const code = makeSaveCode(G.boxes, G.xp);

  app.innerHTML = `
    <div class="res-head"><div class="res-emoji">${emoji}</div><div class="res-title">${title}</div></div>
    <div class="res-score"><b>${nOK}</b> / ${n} もん せいかい</div>
    <div class="res-stars">${"🌟".repeat(stars)}${"☆".repeat(3-stars)}</div>
    ${s.best>=3?`<div class="res-score" style="font-size:15px">🔥 さいだい ${s.best}れんぞく正解!</div>`:""}

    <div class="journey-card">
      <div class="journey-move">${moved>0?`${moved}歩 すすんだ!`:"今回はたびの歩数なし(全問復習ミス0でもOK、また次回!)"}</div>
      <div class="journey-nodes">
        <span>${startNode.emoji}</span>
        ${moved>0?`<span class="journey-arrow">→</span><span>${newNode.emoji}</span>`:""}
      </div>
      <div class="journey-newname">いま: ${newNode.name}${atGoal?" 🎉":""}</div>
      ${atGoal ? `<div class="map-goal" style="margin-top:8px">${SKIN.map.goalMessage}</div>` : ""}
    </div>

    ${earned.length ? `<div class="title-wrap">${earned.map(t=>`<span class="title-badge">🏅 ${t.name}</span>`).join("")}</div>` : ""}

    <div class="savecode-card">
      <div class="savecode-label">🔑 きょうのセーブコード(おうちの人にメモしてもらおう)</div>
      <div class="savecode-text">${code}</div>
      <div class="savecode-note">次回このコードを入れると、たびの続きと復習の記録がもどるよ。</div>
    </div>

    ${misses.length?`<div class="review-head">📖 見直しコーナー(ノートで解き直そう)</div>`:""}
    ${misses.map(r=>`<div class="review">
        <div class="rq">Q. ${r.q.q}</div>
        <div class="ra"><span class="miss">きみの答え: ${r.my}</span> → 正解: <b>${r.q.ans[0]}${r.q.unit_label||""}</b><br>${r.q.exp}</div>
      </div>`).join("")}
    <div class="res-btns">
      <button class="retry" id="retry">もう一回 🔁</button>
      <button class="gohome" id="home">ホームへ</button>
    </div>`;
  document.getElementById("retry").addEventListener("click", ()=>startQuiz(s.cat));
  document.getElementById("home").addEventListener("click", ()=>renderHome());
}

renderHome();
</script>
</body>
</html>
