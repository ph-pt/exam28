<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>テストじゅんびクエスト</title>
<style>
  :root{
    --ink:#3A2E2A;
    --paper:#FFF7EC;
    --card:#FFFFFF;
    --orange:#FF8A3D;
    --orange-deep:#F0742A;
    --mint:#2FBF8F;
    --coral:#F26D6D;
    --star:#FFC53D;
    --sky:#5AA9E6;
    --line:#EFE0D0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","BIZ UDGothic","Yu Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex; justify-content:center;
    min-height:100%;
    -webkit-user-select:none; user-select:none;
  }
  #app{width:100%; max-width:720px; padding:20px 18px 30px; display:flex; flex-direction:column; min-height:100vh;}

  .warn-banner{background:#FFF3E6; border:2px solid var(--orange); border-radius:14px; padding:10px 14px; font-size:13px; margin-bottom:14px; line-height:1.6;}

  /* ---------- home ---------- */
  .home-title{ text-align:center; font-size:28px; font-weight:800; letter-spacing:1px; margin:10px 0 4px; }
  .home-sub{text-align:center; font-size:14px; color:#8A7A6E; margin-bottom:20px; line-height:1.6;}

  /* ---------- boss card ---------- */
  .boss-card{
    background:var(--card); border-radius:22px; padding:22px 20px 20px; margin-bottom:16px;
    box-shadow:0 5px 0 var(--line); text-align:center;
  }
  .boss-emoji-big{font-size:56px; line-height:1.1;}
  .boss-card.enraged .boss-emoji-big{ animation:shake .5s infinite; }
  @keyframes shake{ 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-6deg);} 75%{transform:rotate(6deg);} }
  .boss-card.defeated{ background:#FFF9E6; }
  .boss-name{font-size:20px; font-weight:800; margin-top:4px;}
  .boss-flavor{font-size:13.5px; color:#8A7A6E; margin:8px 0 14px; line-height:1.6;}
  .hp-label{font-size:12px; font-weight:700; color:#B08968; text-align:left; margin-bottom:4px;}
  .hp-bar-track{background:#F4E7D8; border-radius:999px; height:16px; overflow:hidden;}
  .hp-bar-fill{background:linear-gradient(90deg, var(--coral), var(--orange)); height:100%; border-radius:999px; transition:width .5s;}
  .hp-text{font-size:13px; color:#8A7A6E; margin-top:6px; font-weight:700;}
  .defeat-banner{margin-top:12px; font-size:15px; font-weight:800; color:#C77D00; animation:pop .3s;}

  /* ---------- seals ---------- */
  .seals-row{display:flex; gap:8px; margin-bottom:16px;}
  .seal-item{
    flex:1; background:var(--card); border-radius:16px; padding:10px 6px; text-align:center;
    box-shadow:0 3px 0 var(--line);
  }
  .seal-item.locked{opacity:.72;}
  .seal-item.unlocked{box-shadow:0 3px 0 var(--star);}
  .seal-icon{font-size:20px;}
  .seal-name{font-size:11.5px; font-weight:700; margin:2px 0 6px;}
  .seal-bar-track{background:#F4E7D8; border-radius:999px; height:6px; overflow:hidden;}
  .seal-bar-fill{background:var(--mint); height:100%; border-radius:999px; transition:width .4s;}
  .seal-pct{font-size:10.5px; color:#8A7A6E; margin-top:4px;}

  .sealbreak-banner{
    background:#FFF3E6; border:2px dashed var(--star); border-radius:14px; padding:10px 14px;
    font-size:13.5px; font-weight:700; margin-bottom:14px; text-align:center; line-height:1.6;
  }

  .code-card{ background:var(--card); border-radius:20px; padding:16px 18px; margin-bottom:16px; box-shadow:0 4px 0 var(--line); }
  .code-label{font-size:13.5px; font-weight:700; margin-bottom:8px;}
  .code-row{display:flex; gap:8px;}
  .code-input{
    flex:1; font-family:inherit; font-size:15px; padding:10px 12px; border-radius:12px;
    border:2px solid var(--line); background:#FBF4EB; color:var(--ink); letter-spacing:1px;
  }
  .code-btn{
    font-family:inherit; font-size:14px; font-weight:800; padding:10px 16px; border:none;
    border-radius:12px; background:var(--sky); color:#fff; cursor:pointer; box-shadow:0 3px 0 #3E86BD;
  }
  .code-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #3E86BD;}
  .code-msg{font-size:13px; margin-top:8px; line-height:1.6;}
  .code-msg.ok{color:#159A6E;} .code-msg.ng{color:#D64F4F;}

  .home-note{font-size:12px; color:#B0A395; text-align:center; margin-top:auto; padding-top:20px; line-height:1.7;}
  .parent-menu-row{text-align:center; padding-top:14px; display:flex; justify-content:center; gap:18px; flex-wrap:wrap;}
  .parent-menu-btn{background:none; border:none; color:#C2B3A4; font-size:11.5px; font-family:inherit; padding:8px; cursor:pointer; text-decoration:underline;}
  .bank-paste{
    width:100%; font-family:ui-monospace,monospace; font-size:12.5px; line-height:1.5; padding:10px 12px;
    border-radius:12px; border:2px solid var(--line); background:#FBF4EB; color:var(--ink); resize:vertical;
  }
  .bank-file{width:100%; font-family:inherit; font-size:14px; padding:10px;
    background:#FDF6EF; border:2px dashed var(--sky); border-radius:12px;}
  .reset-bank-btn{
    display:block; width:100%; margin-top:14px; background:var(--card); color:var(--ink); border:none;
    border-radius:16px; padding:15px 0; font-family:inherit; font-size:15px; font-weight:800;
    box-shadow:0 4px 0 var(--line); cursor:pointer;
  }
  .reset-bank-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}

  .doors-label{font-size:14px; font-weight:800; color:#8A7A6E; margin:2px 0 10px; text-align:center;}
  .stage-btn{
    display:block; width:100%; background:var(--card); border:none;
    border-radius:20px; padding:16px 20px; margin-bottom:12px; text-align:left;
    box-shadow:0 4px 0 var(--line); cursor:pointer;
    font-family:inherit; color:var(--ink); transition:transform .08s;
  }
  .stage-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}
  .stage-btn .stage-name{font-size:19px; font-weight:800;}
  .stage-btn .stage-desc{font-size:13px; color:#8A7A6E; margin-top:4px;}
  .stage-btn.omakase{background:#FFF3E6;}

  /* ---------- quiz ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .quit-btn{background:none; border:none; font-size:14px; color:#B0A395; font-family:inherit; padding:6px 4px; cursor:pointer; flex-shrink:0;}
  .hp-mini{flex:1; display:flex; align-items:center; gap:6px;}
  .hp-mini .em{font-size:16px;}
  .hp-mini-track{flex:1; background:#F4E7D8; border-radius:999px; height:7px; overflow:hidden;}
  .hp-mini-fill{background:linear-gradient(90deg, var(--coral), var(--orange)); height:100%; border-radius:999px; transition:width .5s;}
  .combo{font-size:13px; font-weight:800; color:var(--orange-deep); min-width:70px; text-align:right; flex-shrink:0;}

  .rail{display:flex; gap:5px; justify-content:center; margin-bottom:10px; flex-wrap:wrap;}
  .rail span{font-size:16px; filter:grayscale(1) opacity(.35); transition:filter .3s, transform .3s;}
  .rail span.on{filter:none; transform:scale(1.15);}
  .rail span.ng{filter:grayscale(1) opacity(.8);}

  .revenge-badge{
    display:inline-block; background:var(--coral); color:#fff; font-size:12.5px; font-weight:800;
    border-radius:999px; padding:4px 12px; margin-bottom:8px;
  }

  .qcard{
    background:var(--card); border-radius:24px; padding:24px 22px;
    box-shadow:0 5px 0 var(--line);
  }
  .qnum{font-size:13px; font-weight:700; color:var(--sky); margin-bottom:8px;}
  .qtext{font-size:21px; line-height:1.7; font-weight:600; min-height:3.4em;}
  .write-tip{font-size:12.5px; color:#B0A395; margin-top:10px;}

  .answer-row{display:flex; align-items:center; gap:10px; margin:18px 0 4px;}
  .answer-box{
    flex:1; font-size:28px; font-weight:800; text-align:center;
    background:#FDF6EF; border:2px dashed var(--sky); border-radius:14px;
    min-height:58px; display:flex; align-items:center; justify-content:center;
    letter-spacing:1px; overflow:hidden;
  }
  .answer-box.filled{border-style:solid;}
  input.answer-box{
    display:block; text-align:center; padding:0 16px; font-family:inherit;
    -webkit-appearance:none; appearance:none;
  }
  input.answer-box.answer-input{ text-align:left; }
  input.answer-box:disabled{opacity:.7;}
  input.answer-box::placeholder{font-size:15px; font-weight:600; color:#C2B3A4;}
  .unit{font-size:16px; color:#8A7A6E; font-weight:700; min-width:2em;}

  .hint-area{margin-top:12px;}
  .hint-btn{
    background:#FFF3E6; color:var(--orange-deep); border:none; border-radius:999px;
    font-family:inherit; font-size:14.5px; font-weight:700; padding:10px 18px; cursor:pointer;
  }
  .hint-bubble{
    background:#FFF9EF; border-left:5px solid var(--star); border-radius:0 12px 12px 0;
    padding:10px 14px; margin-top:8px; font-size:15px; line-height:1.6;
  }

  /* keypad */
  .keypad{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px;}
  .key{
    font-family:inherit; font-size:26px; font-weight:800; color:var(--ink);
    background:var(--card); border:none; border-radius:16px; padding:16px 0;
    box-shadow:0 4px 0 var(--line); cursor:pointer; transition:transform .06s;
  }
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}
  .key.fn{background:#F1E4D6; font-size:20px;}
  .key.go{
    grid-column:span 2; background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-deep);
    font-size:22px; letter-spacing:2px;
  }
  .key.go:disabled{opacity:.45;}

  /* feedback */
  .fb{
    margin-top:16px; border-radius:18px; padding:16px 18px; font-size:16px; line-height:1.65;
    animation:pop .25s;
  }
  @keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
  .fb.ok{background:#E4F8F0; border:2px solid var(--mint);}
  .fb.ng{background:#FDECEC; border:2px solid var(--coral);}
  .fb .fb-head{font-size:20px; font-weight:800; margin-bottom:6px;}
  .fb.ok .fb-head{color:#159A6E;} .fb.ng .fb-head{color:#D64F4F;}
  .boss-react{font-size:14px; color:#8A7A6E; margin-bottom:6px;}
  .counter-banner{
    background:#FFE8D6; border-radius:12px; padding:8px 12px; font-size:14px; font-weight:800;
    color:#C0501E; margin-bottom:8px;
  }
  .next-btn{
    display:block; width:100%; margin-top:14px;
    background:var(--sky); color:#fff; border:none; border-radius:16px;
    font-family:inherit; font-size:19px; font-weight:800; padding:15px 0;
    box-shadow:0 4px 0 #3E86BD; cursor:pointer;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #3E86BD;}

  /* ---------- result ---------- */
  .res-head{text-align:center; margin:18px 0 10px;}
  .res-emoji{font-size:52px;}
  .res-title{font-size:24px; font-weight:800; margin-top:8px;}
  .res-score{text-align:center; font-size:18px; margin-bottom:6px;}
  .res-score b{font-size:34px; color:var(--orange-deep);}
  .res-stars{text-align:center; font-size:26px; letter-spacing:4px; margin-bottom:14px;}

  .title-badge{
    display:inline-block; background:linear-gradient(135deg,var(--star),var(--orange)); color:#fff;
    font-size:14px; font-weight:800; border-radius:999px; padding:8px 18px; margin:4px 4px 12px;
    box-shadow:0 3px 0 var(--orange-deep);
  }
  .title-wrap{text-align:center;}

  .review-head{font-size:15px;font-weight:700;margin:8px 0 10px;}
  .review{background:var(--card); border-radius:18px; padding:16px 18px; margin-bottom:12px; box-shadow:0 4px 0 var(--line);}
  .review .rq{font-size:14.5px; font-weight:700; line-height:1.6;}
  .review .ra{font-size:14px; margin-top:6px; line-height:1.6;}
  .review .ra b{color:#159A6E;}
  .review .ra .miss{color:#D64F4F; font-weight:700;}
  .log-badge{display:inline-block; font-size:12px; font-weight:800; border-radius:999px; padding:3px 10px; margin-left:8px;}
  .log-badge.gold{background:#FFF3D0; color:#B8860B;}
  .log-badge.silver{background:#EFEFEF; color:#7A7A7A;}

  .savecode-card{
    background:#3A2E2A; color:#fff; border-radius:20px; padding:20px; margin:16px 0; text-align:center;
  }
  .savecode-label{font-size:13px; opacity:.8; margin-bottom:8px;}
  .savecode-text{
    font-size:19px; font-weight:800; letter-spacing:1px; word-break:break-all;
    background:rgba(255,255,255,.12); border-radius:12px; padding:12px 14px; margin-bottom:8px;
  }
  .savecode-note{font-size:12.5px; opacity:.85; line-height:1.6;}

  .res-btns{display:flex; gap:12px; margin-top:16px;}
  .res-btns button{
    flex:1; font-family:inherit; font-size:17px; font-weight:800; padding:15px 0;
    border:none; border-radius:16px; cursor:pointer;
  }
  .retry{background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-deep);}
  .gohome{background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line);}

  /* ---------- confirm ---------- */
  .confirm-card{background:var(--card); border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:0 4px 0 var(--line); font-size:14.5px; line-height:1.8;}
  .confirm-btns{display:flex; gap:10px; margin-top:14px;}
  .confirm-btns button{flex:1;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important; transition:none!important;}
  }

  /* v1.3 回チップ */
  .stage-group{margin-bottom:10px;}
  .kai-row{display:flex; gap:8px; margin:4px 2px 8px;}
  .kai-chip{border:none; border-radius:10px; padding:7px 12px; font-size:13px; font-weight:bold; font-family:inherit;}
  .kai-chip.on{background:#E7F6EF; color:#2FBF8F;}
  .kai-chip.off{background:#FFE9D6; color:#B85C00; box-shadow:0 2px 0 #E8C7A8; cursor:pointer;}
  .kai-chip.off:active{transform:translateY(2px); box-shadow:none;}
</style>
</head>

  }

    return { ok:false, reason:"testDateがISO日付(YYYY-MM-DD形式)で設定されていません。" };

    return { ok:false, reason:"questions配列が見つかりません。" };
  }
  if(!Array.isArray(candidate.cats) || !REQUIRED_CATS.every(rc=>candidate.cats.some(c=>c && c.cat===rc))){
    return { ok:false, reason:"catsに4科(算数・国語・社会・理科)すべてが定義されている必要があります。" };
  }

  const idRe = /^Y\d{4}$/;
  const idSet = new Set();
  for(const q of candidate.questions){
    if(!q || !q.id || !idRe.test(q.id)){
      return { ok:false, reason:`不正なid形式があります: ${q && q.id}(Y+4桁の形式にしてください)` };
    }
    if(idSet.has(q.id)){
      return { ok:false, reason:`idが重複しています: ${q.id}` };
    }
    idSet.add(q.id);
    if(!q.cat || !REQUIRED_CATS.includes(q.cat)){
      return { ok:false, reason:`catが4科(算数/国語/社会/理科)のいずれでもない問題があります(id: ${q.id})。` };
    }
    if(!Array.isArray(q.ans) || q.ans.length===0){
      return { ok:false, reason:`ansが未設定の問題があります(id: ${q.id})。` };
    }
    const numeric = isNumericQuestion(q);

    if(!numeric && q.cat !== "国語" && q.ans.length < 2){

  }
  return { ok:true, bank:candidate };
}

/* ---------- Base32 セーブコード(V2: バンク成長対応 / V1: 旧形式の互換読み込み) ---------- */
// 予習クエストでは「未出題」を明示的に区別するため、既定値は2ではなく0(直近誤答と同じ「未マスター」域)にする。
// 未出題→box0という写像は、往復後に revenge 判定がやや粗くなる(未出題だったのか直近誤答だったのか区別できない)
// トレードオフを許容している(HP/マスター率の正しさには影響しない。両者ともマスター率には数えないため)。
const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function bitsFromInt(n, len){ return (n>>>0).toString(2).padStart(len, "0"); }

function checksum(str){
  let sum = 0;
  for(let i=0;i<str.length;i++){ sum = (sum*31 + str.charCodeAt(i)) >>> 0; }
  return B32[sum % 32];
}
function pad2(n){ return String(n).padStart(2,"0"); }
function todayDateStr(){
  const d = new Date();
  return String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
}
function parseDateStr(dateStr){
  const yy = parseInt(dateStr.slice(0,2),10), mm = parseInt(dateStr.slice(2,4),10), dd = parseInt(dateStr.slice(4,6),10);
  if(Number.isNaN(yy)||Number.isNaN(mm)||Number.isNaN(dd)) return null;
  const d = new Date(2000+yy, mm-1, dd);
  if(Number.isNaN(d.getTime())) return null;
  return d;
}

// --- V1形式(旧・固定問題数前提。互換読み込み専用) ---
function packStateV1(boxes, xp){
  let bits = "";
  ALL_QS.forEach(q=>{ bits += bitsFromInt(boxes[q.id] ?? 0, 2); });
  bits += bitsFromInt(Math.min(xp, 4095), 12);
  while(bits.length % 5 !== 0) bits += "0";
  let out = "";
  for(let i=0;i<bits.length;i+=5){ out += B32[parseInt(bits.substr(i,5),2)]; }
  return out;
}
function unpackStateV1(str){
  let bits = "";
  for(const ch of str.toUpperCase()){
    const idx = B32.indexOf(ch);
    if(idx < 0) throw new Error("invalid char");
    bits += bitsFromInt(idx, 5);
  }
  const needed = ALL_QS.length*2 + 12;
  if(bits.length < needed) throw new Error("too short");
  bits = bits.slice(0, needed);
  const boxes = {};
  ALL_QS.forEach((q,i)=>{ boxes[q.id] = parseInt(bits.substr(i*2,2),2); });
  const xp = parseInt(bits.substr(ALL_QS.length*2, 12), 2);
  return { boxes, xp };
}

// --- V2形式(問題数を10bitで持つ。バンクが増えても古いコードを壊さない) ---
function packStateV2(boxes, xp){
  const n = ALL_QS.length;
  let bits = bitsFromInt(n, 10);
  ALL_QS.forEach(q=>{ bits += bitsFromInt(boxes[q.id] ?? 0, 2); });
  bits += bitsFromInt(Math.min(xp, 4095), 12);
  while(bits.length % 5 !== 0) bits += "0";
  let out = "";
  for(let i=0;i<bits.length;i+=5){ out += B32[parseInt(bits.substr(i,5),2)]; }
  return out;
}
function unpackStateV2(str){
  let bits = "";
  for(const ch of str.toUpperCase()){
    const idx = B32.indexOf(ch);
    if(idx < 0) throw new Error("invalid char");
    bits += bitsFromInt(idx, 5);
  }
  if(bits.length < 10) throw new Error("too short");
  const n = parseInt(bits.substr(0,10), 2);
  const needed = 10 + n*2 + 12;
  if(bits.length < needed) throw new Error("too short");
  bits = bits.slice(0, needed);
  const codeBoxes = [];
  for(let i=0;i<n;i++) codeBoxes.push(parseInt(bits.substr(10+i*2,2),2));
  const xp = parseInt(bits.substr(10+n*2,12), 2);
  return { n, codeBoxes, xp };
}
// V2のcodeBoxes(コード作成時点でのid昇順n件)を、現在のALL_QSへ写像。
// i >= n の問題(コード作成後に増えた分)はboxesに設定せず「未出題」のまま残す
function applyV2Code(decoded){
  if(decoded.n > ALL_QS.length) return { error: "bank_old" };
  const boxes = {};
  ALL_QS.forEach((q,i)=>{ if(i < decoded.n) boxes[q.id] = decoded.codeBoxes[i]; });
  return { boxes, xp: decoded.xp };
}

function makeSaveCode(boxes, xp){
  const state = packStateV2(boxes, xp);
  const chk = checksum(state);
  return `V2-${todayDateStr()}-${state}${chk}`;
}

function parseSaveCode(raw){
  const code = (raw||"").trim().toUpperCase();

  let m = code.match(/^V2-(\d{6})-([A-Z2-7]+)$/);
  if(m){
    const dateStr = m[1], body = m[2];
    if(body.length < 2) return null;
    const state = body.slice(0,-1), chk = body.slice(-1);
    if(checksum(state) !== chk) return null;
    let decoded;
    try{ decoded = unpackStateV2(state); }catch(e){ return null; }
    const applied = applyV2Code(decoded);
    if(applied.error) return { error: applied.error };
    const savedDate = parseDateStr(dateStr);
    if(!savedDate) return null;
    return { boxes: applied.boxes, xp: applied.xp, savedDate, version: "V2" };
  }

  m = code.match(/^V1-(\d{6})-([A-Z2-7]+)$/);
  if(m){
    const dateStr = m[1], body = m[2];
    if(body.length < 2) return null;
    const state = body.slice(0,-1), chk = body.slice(-1);
    if(checksum(state) !== chk) return null;
    let decoded;
    try{ decoded = unpackStateV1(state); }catch(e){ return null; }
    const savedDate = parseDateStr(dateStr);
    if(!savedDate) return null;
    return { boxes: decoded.boxes, xp: decoded.xp, savedDate, version: "V1" };
  }

  return null;
}

/* ---------- 圧縮ライトナー式 復習スケジュール(0/1/3日) ---------- */
const INTERVAL_DAYS = {0:0, 1:1, 2:3, 3:3};
function daysSince(savedDate){
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(savedDate.getFullYear(), savedDate.getMonth(), savedDate.getDate());
  return Math.floor((a-b) / 86400000);
}
function isDue(box, ds){ return ds >= (INTERVAL_DAYS[box] ?? 0); }

function shuffle(arr){
  const b=[...arr];
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

// セッション構成(最大8問): 箱0(直近誤答)最大2/4問 → 期日到来の復習 → 未出題で補完 → 間口内の残りで補完
// 「未出題」はboxes[id]が存在しないことで判定(0=直近誤答と明確に区別)
// v1.3.1: 間口(科目)を選んだときは、箱0・補完もすべて間口内に限定する。
//         解放済みの問題が8問に満たない場合はセッションを短くする(他科目は絶対に混ぜない)。
//         🎲おまかせミックス(cat=null)のときだけ全科目から出題する。
function buildSession(boxes, savedDate, cat){
  const ds = daysSince(savedDate);
  const inCat = q => !cat || q.cat === cat;
  // v1.3.1: 間口で先に絞り込む。以降のプールはすべて間口内。
  const UQS = unlockedQs().filter(inCat);  // v1.3: 未解放の回は出題しない
  const pool0=[], due1=[], due2=[], due3=[], unseen=[];
  UQS.forEach(q=>{
    const box = boxes[q.id];
    if(box === undefined){
      unseen.push(q);
    } else if(box === 0){
      pool0.push(q);
    } else if(box === 1 && isDue(1, ds)){
      due1.push(q);
    } else if(box === 2 && isDue(2, ds)){
      due2.push(q);
    } else if(box === 3 && isDue(3, ds)){
      due3.push(q);
    }
  });
  const revCap = cat ? 2 : 4;
  const review = [...shuffle(pool0).slice(0, revCap), ...shuffle(due1), ...shuffle(due2), ...shuffle(due3)].slice(0, 4);
  const revengeIds = new Set(pool0.map(q=>q.id));
  const usedIds = new Set(review.map(q=>q.id));
  const needed = Math.max(0, 8 - review.length);
  const fill = shuffle(unseen.filter(q=>!usedIds.has(q.id))).slice(0, needed);
  let session = [...review, ...fill];
  if(session.length < 8){
    // 全問マスター済み等で足りない場合は、間口内の残り(期日前の問題)から補完
    const usedAll = new Set(session.map(q=>q.id));
    const backfill = shuffle(UQS.filter(q=>!usedAll.has(q.id))).slice(0, 8-session.length);
    session = [...session, ...backfill];
  }
  return shuffle(session).map(q=>({...q, _revenge: revengeIds.has(q.id)}));
}

/* ---------- 入力モード判定・正規化(答え合わせ用) ---------- */
function isNumericQuestion(q){
  return q.ans.every(a => /^-?\d+(\.\d+)?$/.test(a) || /^\d+\/\d+$/.test(a));
}
function normZen(s){
  return s.replace(/[０-９．／]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}
function norm(s, numeric){
  const z = normZen(s);
  if(numeric){
    return z.replace(/[\s。、点円個こ回人gkmcページ]/g,"").trim();
  }
  return z.replace(/[\s。、!?]/g,"")
          .replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
          .trim();
}

/* ---------- 称号判定 ---------- */
function condMet(cond, stats, totalXp){
  if(cond.startsWith("noHintStreak")) return stats.noHintMaxStreak >= parseInt(cond.replace("noHintStreak",""),10);
  if(cond.startsWith("hintCorrect")) return stats.hintCorrectCount >= parseInt(cond.replace("hintCorrect",""),10);
  if(cond === "revengeWin") return stats.revengeWin;
  if(cond === "perfectStage") return stats.perfectStage;
  if(cond.startsWith("totalCorrect")) return totalXp >= parseInt(cond.replace("totalCorrect",""),10);
  return false;
}

/* ---------- マスター率・ボスHP・封印 ---------- */
const SEAL_THRESHOLD = 80;
function masteredCount(qs){ return qs.filter(q => (G.boxes[q.id] ?? -1) >= 2).length; }
function masteryPctOf(qs){ return qs.length ? Math.round(masteredCount(qs) / qs.length * 100) : 0; }
function overallMasteryPct(){ return masteryPctOf(unlockedQs()); }
function subjectMasteryPct(cat){ return masteryPctOf(unlockedQs().filter(q=>q.cat===cat)); }
// v1.2: HPは部分点方式(箱1=0.5pt、箱2以上=1pt)。初日から進捗が見えるようにする。
// 封印・討伐・討伐記録は従来通り厳密なマスター率(箱2以上)を使う。HP0 ⇔ 全問箱2以上(討伐条件と一致)。
// v1.3: 母数は「解放済みの回」の問題のみ。回を解放すると分母が増えHPが戻る(=ボスのパワーアップ演出)。
function progressPct(){
  const qs = unlockedQs();
  if(!qs.length) return 0;
  let pts = 0;
  qs.forEach(q=>{
    const b = G.boxes[q.id] ?? -1;
    if(b >= 2) pts += 1;
    else if(b === 1) pts += 0.5;
  });
  return Math.round(pts / qs.length * 100);
}
function bossHP(){ return 100 - progressPct(); }
function sealBroken(cat){ return subjectMasteryPct(cat) >= SEAL_THRESHOLD; }
function allSealsBroken(){ return CATS.length>0 && CATS.every(c=>sealBroken(c.cat)); }

/* ---------- 回単位の解放ゲート(v1.3) ---------- */
// 各科目の回はバンクから自動検出(1回でもN回でも動く)。初期状態は各科目の最初の回のみ解放。
// 解放状態はlocalStorageに保存するが、消えても自己修復する:
//   ①各科目の最初の回は常に解放 ②箱に進捗がある回は解放済みとみなす(遊べた=解放されていた証拠)
const UNLOCK_KEY = "quest_unlock_" + BUILTIN_BANK.subject;
function kaisOf(cat){ return [...new Set(LIVE_QS.filter(q=>q.cat===cat).map(q=>q.kai))].sort((a,b)=>a-b); }
function loadStoredUnlocks(){ try{ const v = localStorage.getItem(UNLOCK_KEY); return v ? JSON.parse(v) : []; }catch(e){ return []; } }
function saveStoredUnlocks(list){ try{ localStorage.setItem(UNLOCK_KEY, JSON.stringify(list)); }catch(e){} }
function unlockedKeys(){
  const set = new Set(loadStoredUnlocks());
  CATS.forEach(c=>{ const ks = kaisOf(c.cat); if(ks.length) set.add(c.cat+":"+ks[0]); });
  LIVE_QS.forEach(q=>{ if(G.boxes[q.id] !== undefined) set.add(q.cat+":"+q.kai); });
  return set;
}
function unlockedQs(){ const u = unlockedKeys(); return LIVE_QS.filter(q=>u.has(q.cat+":"+q.kai)); }
function allKaisUnlocked(){ const u = unlockedKeys(); return LIVE_QS.every(q=>u.has(q.cat+":"+q.kai)); }
function unlockKai(cat, kai){
  const list = loadStoredUnlocks();
  const k = cat+":"+kai;
  if(!list.includes(k)){ list.push(k); saveStoredUnlocks(list); }
}

      renderParentMenu({target:'bank', ok:false, text:"❌ 更新できませんでした: " + result.reason});
      return;
    }
    const versionChanged = result.bank.bankVersion !== BANK.bankVersion;
    if(versionChanged){
      pendingBankSwitch = result.bank;
      renderBankSwitchConfirm();
    } else {
      applyBankDirect(result.bank);
      renderParentMenu({target:'bank', ok:true, text: (storageAvailable ? "✅ 同じバージョンのバンクを再読み込みしました(端末保存・進捗は維持)。" : "✅ 今回のセッションで再読み込みしました(進捗は維持・保存はされません)。")});
    }
  };
  document.getElementById("applyBankBtn").addEventListener("click", ()=>doApplyBank(document.getElementById("bankPaste").value));
  document.getElementById("bankFile").addEventListener("change", (ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>doApplyBank(String(rd.result));
    rd.onerror = ()=>renderParentMenu({target:'bank', ok:false, text:"❌ ファイルを読み込めませんでした。"});
    rd.readAsText(f);
  });
  document.getElementById("resetBankBtn").addEventListener("click", ()=>{
    if(BUILTIN_BANK.bankVersion !== BANK.bankVersion){
      pendingBankSwitch = BUILTIN_BANK;
      renderBankSwitchConfirm();
    } else {
      applyBankDirect(BUILTIN_BANK);
      if(storageAvailable){ try{ localStorage.removeItem(BANK_STORAGE_KEY); }catch(e){} }
      bankSource = "builtin";
      renderParentMenu({target:'bank', ok:true, text:"🔄 内蔵バンクに戻しました。"});
    }
  });

  const doApplySkin = (text)=>{
    const result = validateSkinPaste(text);
    if(!result.ok){
      renderParentMenu({target:'skin', ok:false, text:"❌ 更新できませんでした: " + result.reason});
      return;
    }
    SKIN = result.skin;
    applySkinColorsRuntime();
    let saved = false;
    if(storageAvailable){
      try{ localStorage.setItem(SKIN_STORAGE_KEY, JSON.stringify(SKIN)); saved = true; skinSource = "local"; }
      catch(e){ saved = false; }
    }
    renderParentMenu({target:'skin', ok:true, text: saved
      ? "✅ スキンを更新しました!(端末に保存されました)"
      : "✅ 今回のセッションでスキンを更新しました(保存はされていません)。"});
  };
  document.getElementById("applySkinBtn").addEventListener("click", ()=>doApplySkin(document.getElementById("skinPaste").value));
  document.getElementById("skinFile").addEventListener("change", (ev)=>{
    const f = ev.target.files && ev.target.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>doApplySkin(String(rd.result));
    rd.onerror = ()=>renderParentMenu({target:'skin', ok:false, text:"❌ ファイルを読み込めませんでした。"});
    rd.readAsText(f);
  });
  document.getElementById("resetSkinBtn").addEventListener("click", ()=>{
    SKIN = BUILTIN_SKIN;
    applySkinColorsRuntime();
    if(storageAvailable){ try{ localStorage.removeItem(SKIN_STORAGE_KEY); }catch(e){} }
    skinSource = "builtin";
    renderParentMenu({target:'skin', ok:true, text:"🔄 内蔵スキンに戻しました。"});
  });
}

/* ---------- クイズ画面(バトル) ---------- */
function startQuiz(cat){
  const qs = buildSession(G.boxes, G.savedDate, cat || null);
  const startSubjMastery = {};
  CATS.forEach(c=>{ startSubjMastery[c.cat] = subjectMasteryPct(c.cat); });
  quiz = {
    qs, cat: cat || null, idx:0, input:"", hint:0, answered:false,
    results:[], combo:0, best:0,
    startOverallMastery: overallMasteryPct(),
    startSubjMastery,
    noHintStreak:0, noHintMaxStreak:0, hintCorrectCount:0, revengeWin:false,
    sealBreaksThisSession: []
  };
  renderQ();
}

function renderQ(){
  const s = quiz, q = s.qs[s.idx];
  s.numeric = isNumericQuestion(q);
  const rail = s.qs.map((_,i)=>{
    if(i < s.results.length) return `<span class="${s.results[i].ok?'on':'ng'}">${s.results[i].ok?'⭐':'💧'}</span>`;
    return `<span>⭐</span>`;
  }).join("");
  const hp = bossHP();
  const catInfo = CATS.find(c=>c.cat===q.cat);
  const bossEmoji = (SKIN.boss && SKIN.boss.emoji) || "👑";

  app.innerHTML = `
    <div class="topbar">
      <button class="quit-btn" id="quit">← やめる</button>
      <div class="hp-mini">
        <span class="em">${bossEmoji}</span>
        <div class="hp-mini-track"><div class="hp-mini-fill" style="width:${Math.max(hp,0)}%"></div></div>
      </div>
      <div class="combo">${s.combo>=2?`🔥${s.combo}れんぞく!`:""}</div>
    </div>
    <div class="rail">${rail}</div>
    <div class="qcard">
      ${q._revenge ? `<div class="revenge-badge">🔥 リベンジ問題!</div>` : ""}
      <div class="qnum">${catInfo?catInfo.icon:""} ${q.cat} ・ だい ${s.idx+1} もん / ${s.qs.length}もん</div>
      <div class="qtext">${q.q}</div>
      <div class="answer-row">
        ${quiz.numeric
          ? `<input type="text" class="answer-box" id="ansbox" inputmode="none" autocomplete="off" enterkeyhint="done">`
          : `<input type="text" class="answer-box answer-input" id="ansbox" placeholder="かんじ・かなで にゅうりょく" autocomplete="off" autocapitalize="off" enterkeyhint="done">`}
        <div class="unit">${q.unit_label || ""}</div>
      </div>
      <div class="write-tip">✏️ ${SKIN.writeTip || "まずノートに式を書こう。それが「さいしょの一手」!"}</div>
      <div class="hint-area" id="hintarea">
        <button class="hint-btn" id="hintbtn">💡 ヒントを見る</button>
      </div>
      <div id="fbarea"></div>
    </div>
    ${quiz.numeric ? `<div class="keypad" id="pad"></div>` : `<button class="next-btn submit-btn" id="submitBtn" disabled>こたえあわせ</button>`}`;
  document.getElementById("quit").addEventListener("click", ()=>renderHome());
  document.getElementById("hintbtn").addEventListener("click", showHint);

  const input = document.getElementById("ansbox");
  input.addEventListener("input", ()=>{ quiz.input = input.value; updateAns(); });
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && quiz.input && quiz.input.trim() && !quiz.answered) check(); });

  if(quiz.numeric){
    renderPad();
    updateAns();
  } else {
    document.getElementById("submitBtn").addEventListener("click", check);
    input.focus();
  }
}

function renderPad(){
  const pad = document.getElementById("pad");
  const keys = ["7","8","9","⌫","4","5","6","/","1","2","3",".","0"];
  pad.innerHTML = keys.map(k=>`<button class="key ${["⌫","/","."].includes(k)?"fn":""}" data-k="${k}">${k}</button>`).join("")
    + `<button class="key go" id="gobtn">こたえあわせ</button>`;
  pad.querySelectorAll(".key[data-k]").forEach(b=>b.addEventListener("click",()=>tapKey(b.dataset.k)));
  document.getElementById("gobtn").addEventListener("click", check);
}

function tapKey(k){
  if(quiz.answered) return;
  const input = document.getElementById("ansbox");
  if(k==="⌫") input.value = input.value.slice(0,-1);
  else if(input.value.length<8) input.value += k;
  quiz.input = input.value;
  updateAns();
}

function updateAns(){
  const box = document.getElementById("ansbox");
  if(!box) return;
  box.classList.toggle("filled", !!quiz.input);
  box.disabled = quiz.answered;
  if(quiz.numeric){
    const go = document.getElementById("gobtn");
    if(go) go.disabled = !quiz.input || quiz.answered;
  } else {
    const btn = document.getElementById("submitBtn");
    if(btn) btn.disabled = !quiz.input || !quiz.input.trim() || quiz.answered;
  }
}

function showHint(){
  const q = quiz.qs[quiz.idx];
  const area = document.getElementById("hintarea");
  quiz.hint++;
  const bubbles = [];
  if(quiz.hint>=1) bubbles.push(`<div class="hint-bubble">💡 <b>考え方</b>: ${q.h1}</div>`);
  if(quiz.hint>=2) bubbles.push(`<div class="hint-bubble">🧮 <b>式</b>: ${q.h2}</div>`);
  const btnLabel = quiz.hint===1 ? "💡 もうひとつヒント(式)" : "";
  area.innerHTML = bubbles.join("") + (btnLabel?`<div style="margin-top:8px"><button class="hint-btn" id="hintbtn">${btnLabel}</button></div>`:"");
  const nb = document.getElementById("hintbtn");
  if(nb) nb.addEventListener("click", showHint);
}

function check(){
  const s = quiz, q = s.qs[s.idx];
  if(s.answered || !s.input) return;
  s.answered = true;
  const numeric = isNumericQuestion(q);
  const okSet = new Set(q.ans.map(a=>norm(a, numeric)));
  const ok = okSet.has(norm(s.input, numeric));
  s.results.push({q, ok, my:s.input, hintUsed:s.hint});

  const preSubjPct = subjectMasteryPct(q.cat);
  // 未出題(undefined)は0扱いを基準に+1する(=未出題からの初正解→箱1)。誤答は常に箱0へ。
  const curBox = G.boxes[q.id] ?? 0;
  G.boxes[q.id] = ok ? Math.min(curBox+1, 3) : 0;
  if(ok) G.xp = Math.min(G.xp+1, 4095);
  const postSubjPct = subjectMasteryPct(q.cat);

  let sealJustBroken = false;
  if(preSubjPct < SEAL_THRESHOLD && postSubjPct >= SEAL_THRESHOLD){
    sealJustBroken = true;
    s.sealBreaksThisSession.push(q.cat);
  }
  const isCounter = ok && q._revenge;

  if(ok){
    s.combo++; s.best=Math.max(s.best,s.combo);
    if(s.hint===0){ s.noHintStreak++; s.noHintMaxStreak=Math.max(s.noHintMaxStreak, s.noHintStreak); }
    else { s.noHintStreak=0; s.hintCorrectCount++; }
    if(q._revenge) s.revengeWin = true;
  } else {
    s.combo=0; s.noHintStreak=0;
  }

  const fb = document.getElementById("fbarea");
  const last = s.idx === s.qs.length-1;
  const boss = SKIN.boss || {};
  const dmgLines = (boss.lines && boss.lines.damage) || [];
  const dmgLine = dmgLines.length ? dmgLines[Math.floor(Math.random()*dmgLines.length)] : "";

  if(ok){
    const p = SKIN.praise[Math.floor(Math.random()*SKIN.praise.length)];
    fb.innerHTML = `<div class="fb ok">
      <div class="fb-head">⚔️ ヒット! ${p}</div>
      ${dmgLine ? `<div class="boss-react">${boss.emoji||""} 「${dmgLine}」</div>` : ""}
      ${isCounter ? `<div class="counter-banner">🔥 ${(boss.lines&&boss.lines.counter) || "カウンター攻撃! リベンジ成功でクリティカル!!"}</div>` : ""}
      ${sealJustBroken ? `<div class="sealbreak-banner">✨ ${(boss.lines&&boss.lines.sealBreak) || "封印がひとつ解けた!"}(${q.cat})</div>` : ""}
      ${s.hint===0?"ノーヒントはえらい!":SKIN.hintPraise}
      <button class="next-btn" id="next">${last?"けっかを見る 🏁":"つぎの問題へ ▶"}</button></div>`;
  }else{
    const c = SKIN.cheer[Math.floor(Math.random()*SKIN.cheer.length)];
    fb.innerHTML = `<div class="fb ng"><div class="fb-head">❌ ざんねん…</div>
      正解は <b>${q.ans[0]}${q.unit_label||""}</b>。<br>📖 ${q.exp}<br>${c}
      <button class="next-btn" id="next">${last?"けっかを見る 🏁":"つぎの問題へ ▶"}</button></div>`;
  }
  updateAns();
  document.getElementById("next").addEventListener("click", ()=>{
    if(last) renderResult();
    else { s.idx++; s.input=""; s.hint=0; s.answered=false; renderQ(); }
  });
  fb.scrollIntoView({behavior:"smooth", block:"end"});
}

/* ---------- 結果画面(バトル結果) ---------- */
function renderResult(){
  const s = quiz;
  const nOK = s.results.filter(r=>r.ok).length, n = s.results.length;
  const stars = nOK===n?3 : nOK>=n-2?2 : nOK>=Math.ceil(n/2)?1:0;
  const emoji = stars===3?"🏆":stars===2?"🎉":stars===1?"💪":"🌱";
  const title = stars===3?"パーフェクト!!":stars===2?"あと少しで満点!":stars===1?"いいペース!":"ここからスタート!";
  const misses = s.results.filter(r=>!r.ok);
  s.perfectStage = (nOK === n);

  const stats = {
    noHintMaxStreak: s.noHintMaxStreak,
    hintCorrectCount: s.hintCorrectCount,
    revengeWin: s.revengeWin,
    perfectStage: s.perfectStage
  };
  const earned = (SKIN.titles||[]).filter(t => condMet(t.cond, stats, G.xp));

  const hpBefore = 100 - s.startOverallMastery;
  const hpAfter = bossHP();
  const boss = SKIN.boss || {};
  const justDefeated = hpBefore > 0 && hpAfter <= 0;
  const sealBreaks = [...new Set(s.sealBreaksThisSession)];

  G.savedDate = new Date();
  const code = makeSaveCode(G.boxes, G.xp);

  app.innerHTML = `
    <div class="res-head"><div class="res-emoji">${emoji}</div><div class="res-title">${title}</div></div>
    <div class="res-score"><b>${nOK}</b> / ${n} もん せいかい</div>
    <div class="res-stars">${"🌟".repeat(stars)}${"☆".repeat(3-stars)}</div>
    ${s.best>=3?`<div class="res-score" style="font-size:15px">🔥 さいだい ${s.best}れんぞく正解!</div>`:""}

    <div class="boss-card ${hpAfter<=0?'defeated':''}">
      <div class="boss-emoji-big">${hpAfter<=0 ? "🏆" : (boss.emoji||"👑")}</div>
      <div class="boss-name">${boss.name||""}</div>
      <div class="hp-label">HPの変化</div>
      <div class="hp-bar-track"><div class="hp-bar-fill" style="width:${Math.max(hpAfter,0)}%"></div></div>
      <div class="hp-text">${Math.max(hpBefore,0)} → ${Math.max(hpAfter,0)} / 100</div>
      ${justDefeated ? `<div class="defeat-banner">🎉🎊 ${(boss.lines&&boss.lines.defeat) || "討伐した!"} 🎊🎉</div>` : ""}
    </div>

    ${sealBreaks.length ? `<div class="sealbreak-banner">✨ ${(boss.lines&&boss.lines.sealBreak) || "封印がひとつ解けた!"}(${sealBreaks.join("・")})</div>` : ""}

    ${earned.length ? `<div class="title-wrap">${earned.map(t=>`<span class="title-badge">🏅 ${t.name}</span>`).join("")}</div>` : ""}

    <div class="savecode-card">
      <div class="savecode-label">🔑 きょうのセーブコード(おうちの人にメモしてもらおう)</div>
      <div class="savecode-text">${code}</div>
      <div class="savecode-note">次回このコードを入れると、たたかいの続きがもどるよ(ボス交代をまたぐ復元はできません)。</div>
    </div>

    ${misses.length?`<div class="review-head">📖 見直しコーナー(ノートで解き直そう)</div>`:""}
    ${misses.map(r=>`<div class="review">
        <div class="rq">Q. ${r.q.q}</div>
        <div class="ra"><span class="miss">きみの答え: ${r.my}</span> → 正解: <b>${r.q.ans[0]}${r.q.unit_label||""}</b><br>${r.q.exp}</div>
      </div>`).join("")}
    <div class="res-btns">
      <button class="retry" id="retry">もう一回 🔁</button>
      <button class="gohome" id="home">ホームへ</button>
    </div>`;
  document.getElementById("retry").addEventListener("click", ()=>startQuiz(s.cat));
  document.getElementById("home").addEventListener("click", ()=>renderHome());
}

renderHome();
</script>
</body>
