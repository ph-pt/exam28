<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FF8A3D">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>クエスト</title>
<style>
  :root{
    --ink:#26324B; --paper:#EEF4FB; --card:#FFFFFF;
    --orange:#FF8A3D; --orange-deep:#F0742A;
    --mint:#2FBF8F; --coral:#F26D6D; --star:#FFC53D;
    --sky:#5AA9E6; --line:#D9E4F0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","BIZ UDGothic","Yu Gothic",sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; justify-content:center; min-height:100%;
    -webkit-user-select:none; user-select:none;
  }
  #app{width:100%; max-width:720px; padding:20px 18px 30px; display:flex; flex-direction:column; min-height:100vh;}

  .warn-banner{background:#FFF3E6; border:2px solid var(--orange); border-radius:14px; padding:10px 14px; font-size:13px; margin-bottom:14px; line-height:1.6;}
  .banner-link{display:block; margin-top:8px; background:var(--sky); color:#fff; border:none; border-radius:10px; font-family:inherit; font-size:13px; font-weight:800; padding:8px 14px; cursor:pointer;}

  /* ---------- 最上位タブ ---------- */
  .tabbar{display:flex; gap:8px; margin-bottom:16px;}
  .tab{
    flex:1; font-family:inherit; font-size:16px; font-weight:800; padding:12px 0;
    border:none; border-radius:16px; cursor:pointer;
    background:var(--card); color:#8896AC; box-shadow:0 3px 0 var(--line);
  }
  .tab.on{background:var(--orange); color:#fff; box-shadow:0 3px 0 var(--orange-deep);}

  /* ---------- home ---------- */
  .home-title{ text-align:center; font-size:28px; font-weight:800; letter-spacing:1px; margin:10px 0 4px; }
  .home-sub{text-align:center; font-size:14px; color:#5B6B87; margin-bottom:20px; line-height:1.6;}

  .map-card{background:var(--card); border-radius:22px; padding:20px 20px 18px; margin-bottom:18px; box-shadow:0 5px 0 var(--line);}
  .map-label{font-size:12.5px; color:#8896AC; font-weight:700; margin-bottom:6px;}
  .map-here{display:flex; align-items:center; gap:12px;}
  .map-emoji{font-size:42px; flex-shrink:0;}
  .map-name{font-size:22px; font-weight:800;}
  .map-progress-wrap{margin-top:14px;}
  .map-bar-track{background:#EAF1FA; border-radius:999px; height:12px; overflow:hidden;}
  .map-bar-fill{background:linear-gradient(90deg, var(--sky), var(--mint)); height:100%; border-radius:999px; transition:width .4s;}
  .map-progress-text{font-size:12px; color:#8896AC; margin-top:6px; display:flex; justify-content:space-between; gap:8px;}
  .map-goal{font-size:13px; color:var(--orange-deep); font-weight:700; margin-top:8px; text-align:center;}
  .bank-status{font-size:13px; line-height:1.9;}
  .skin-status{font-size:13px; line-height:1.8; margin-top:8px; color:#5B6B87;}

  .code-card{background:var(--card); border-radius:20px; padding:16px 18px; margin-bottom:16px; box-shadow:0 4px 0 var(--line);}
  .code-label{font-size:13.5px; font-weight:700; margin-bottom:8px;}
  .code-row{display:flex; gap:8px;}
  .code-input{flex:1; font-family:inherit; font-size:15px; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:#F8FAFD; color:var(--ink); letter-spacing:1px;}
  .code-btn{font-family:inherit; font-size:14px; font-weight:800; padding:10px 16px; border:none; border-radius:12px; background:var(--sky); color:#fff; cursor:pointer; box-shadow:0 3px 0 #3E86BD;}
  .code-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #3E86BD;}
  .code-msg{font-size:13px; margin-top:8px; line-height:1.6;}
  .code-msg.ok{color:#159A6E;} .code-msg.ng{color:#D64F4F;}
  .slot-select{width:100%; font-family:inherit; font-size:15px; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:#F8FAFD; color:var(--ink);}

  .home-note{font-size:12px; color:#8896AC; text-align:center; margin-top:auto; padding-top:20px; line-height:1.7;}
  .parent-menu-row{text-align:center; padding-top:14px; display:flex; justify-content:center; gap:18px; flex-wrap:wrap;}
  .parent-menu-btn{background:none; border:none; color:#B8C4D6; font-size:11.5px; font-family:inherit; padding:8px; cursor:pointer; text-decoration:underline;}
  .bank-paste{width:100%; font-family:ui-monospace,monospace; font-size:12.5px; line-height:1.5; padding:10px 12px; border-radius:12px; border:2px solid var(--line); background:#F8FAFD; color:var(--ink); resize:vertical;}
  .bank-file{width:100%; font-family:inherit; font-size:14px; padding:10px; background:#F4F8FD; border:2px dashed var(--sky); border-radius:12px;}
  .reset-bank-btn{display:block; width:100%; margin-top:14px; background:var(--card); color:var(--ink); border:none; border-radius:16px; padding:15px 0; font-family:inherit; font-size:15px; font-weight:800; box-shadow:0 4px 0 var(--line); cursor:pointer;}
  .reset-bank-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}

  .doors-label{font-size:14px; font-weight:800; color:#5B6B87; margin:2px 0 10px; text-align:center;}
  .stage-btn{display:block; width:100%; background:var(--card); border:none; border-radius:20px; padding:16px 20px; margin-bottom:12px; text-align:left; box-shadow:0 4px 0 var(--line); cursor:pointer; font-family:inherit; color:var(--ink); transition:transform .08s;}
  .stage-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}
  .stage-btn .stage-name{font-size:19px; font-weight:800;}
  .stage-btn .stage-desc{font-size:13px; color:#5B6B87; margin-top:4px;}
  .stage-btn.omakase{background:#FFF3E6;}
  .door-here{font-size:12.5px; color:#8896AC; margin-top:6px;}
  .stage-group{margin-bottom:10px;}
  .kai-row{display:flex; gap:8px; margin:4px 2px 8px; flex-wrap:wrap;}
  .kai-chip{border:none; border-radius:10px; padding:7px 12px; font-size:13px; font-weight:bold; font-family:inherit;}
  .kai-chip.on{background:#E7F6EF; color:#2FBF8F;}
  .kai-chip.off{background:#FFE9D6; color:#B85C00; box-shadow:0 2px 0 #E8C7A8; cursor:pointer;}
  .kai-chip.off:active{transform:translateY(2px); box-shadow:none;}

  /* ---------- boss ---------- */
  .boss-card{background:var(--card); border-radius:22px; padding:22px 20px 20px; margin-bottom:16px; box-shadow:0 5px 0 var(--line); text-align:center;}
  .boss-emoji-big{font-size:56px; line-height:1.1;}
  .boss-card.enraged .boss-emoji-big{animation:shake .5s infinite;}
  @keyframes shake{0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-6deg);} 75%{transform:rotate(6deg);}}
  .boss-card.defeated{background:#FFF9E6;}
  .boss-name{font-size:20px; font-weight:800; margin-top:4px;}
  .boss-flavor{font-size:13.5px; color:#8896AC; margin:8px 0 14px; line-height:1.6;}
  .hp-label{font-size:12px; font-weight:700; color:#8896AC; text-align:left; margin-bottom:4px;}
  .hp-bar-track{background:#F4E7D8; border-radius:999px; height:16px; overflow:hidden;}
  .hp-bar-fill{background:linear-gradient(90deg, var(--coral), var(--orange)); height:100%; border-radius:999px; transition:width .5s;}
  .hp-text{font-size:13px; color:#8896AC; margin-top:6px; font-weight:700;}
  .defeat-banner{margin-top:12px; font-size:15px; font-weight:800; color:#C77D00; animation:pop .3s;}

  .seals-row{display:flex; gap:8px; margin-bottom:16px;}
  .seal-item{flex:1; background:var(--card); border-radius:16px; padding:10px 6px; text-align:center; box-shadow:0 3px 0 var(--line);}
  .seal-item.locked{opacity:.72;}
  .seal-item.unlocked{box-shadow:0 3px 0 var(--star);}
  .seal-icon{font-size:20px;}
  .seal-name{font-size:11.5px; font-weight:700; margin:2px 0 6px;}
  .seal-bar-track{background:#F4E7D8; border-radius:999px; height:6px; overflow:hidden;}
  .seal-bar-fill{background:var(--mint); height:100%; border-radius:999px; transition:width .4s;}
  .seal-pct{font-size:10.5px; color:#8896AC; margin-top:4px;}
  .sealbreak-banner{background:#FFF3E6; border:2px dashed var(--star); border-radius:14px; padding:10px 14px; font-size:13.5px; font-weight:700; margin-bottom:14px; text-align:center; line-height:1.6;}

  /* ---------- quiz ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .quit-btn{background:none; border:none; font-size:14px; color:#8896AC; font-family:inherit; padding:6px 4px; cursor:pointer; flex-shrink:0;}
  .journey-mini,.hp-mini{flex:1; display:flex; align-items:center; gap:6px;}
  .journey-mini .em,.hp-mini .em{font-size:16px;}
  .journey-mini-track{flex:1; background:#DCE7F5; border-radius:999px; height:7px; overflow:hidden;}
  .journey-mini-fill{background:var(--mint); height:100%; border-radius:999px; transition:width .5s;}
  .hp-mini-track{flex:1; background:#F4E7D8; border-radius:999px; height:7px; overflow:hidden;}
  .hp-mini-fill{background:linear-gradient(90deg, var(--coral), var(--orange)); height:100%; border-radius:999px; transition:width .5s;}
  .combo{font-size:13px; font-weight:800; color:var(--orange-deep); min-width:70px; text-align:right; flex-shrink:0;}

  .rail{display:flex; gap:5px; justify-content:center; margin-bottom:10px; flex-wrap:wrap;}
  .rail span{font-size:16px; filter:grayscale(1) opacity(.35); transition:filter .3s, transform .3s;}
  .rail span.on{filter:none; transform:scale(1.15);}
  .rail span.ng{filter:grayscale(1) opacity(.8);}
  .revenge-badge{display:inline-block; background:var(--coral); color:#fff; font-size:12.5px; font-weight:800; border-radius:999px; padding:4px 12px; margin-bottom:8px;}

  .qcard{background:var(--card); border-radius:24px; padding:24px 22px; box-shadow:0 5px 0 var(--line);}
  .qnum{font-size:13px; font-weight:700; color:var(--sky); margin-bottom:8px;}
  .qtext{font-size:21px; line-height:1.7; font-weight:600; min-height:3.4em;}
  .write-tip{font-size:12.5px; color:#8896AC; margin-top:10px;}

  /* ---------- 図版(SVG) v4.2 §5.2 ---------- */
  /* 問題文の直下・中央寄せ。currentColor がスキンの ink を拾えるよう color を渡す */
  /* §5.2 作図標準: 中央寄せ・max-width 300〜320px(iPad縦/iPhone想定) */
  .qfig{margin:14px auto 0; text-align:center; color:var(--ink);}
  .qfig svg{max-width:min(100%, 320px); height:auto; display:inline-block; vertical-align:middle;}
  .qfig-sm{margin:10px auto;}
  .qfig-sm svg{max-width:min(100%, 240px);}
  .fb .qfig{margin:10px auto;}

  .answer-row{display:flex; align-items:center; gap:10px; margin:18px 0 4px;}
  .answer-box{flex:1; font-size:28px; font-weight:800; text-align:center; background:#F4F8FD; border:2px dashed var(--sky); border-radius:14px; min-height:58px; display:flex; align-items:center; justify-content:center; letter-spacing:1px; overflow:hidden;}
  .answer-box.filled{border-style:solid;}
  input.answer-box{display:block; text-align:center; padding:0 16px; font-family:inherit; -webkit-appearance:none; appearance:none;}
  input.answer-box.answer-input{text-align:left;}
  input.answer-box:disabled{opacity:.7;}
  input.answer-box::placeholder{font-size:15px; font-weight:600; color:#A9B7CC;}
  .unit{font-size:16px; color:#5B6B87; font-weight:700; min-width:2em;}

  .hint-area{margin-top:12px;}
  .hint-btn{background:#FFF3E6; color:var(--orange-deep); border:none; border-radius:999px; font-family:inherit; font-size:14.5px; font-weight:700; padding:10px 18px; cursor:pointer;}
  .hint-bubble{background:#FFF9EF; border-left:5px solid var(--star); border-radius:0 12px 12px 0; padding:10px 14px; margin-top:8px; font-size:15px; line-height:1.6;}

  .keypad{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px;}
  .key{font-family:inherit; font-size:26px; font-weight:800; color:var(--ink); background:var(--card); border:none; border-radius:16px; padding:16px 0; box-shadow:0 4px 0 var(--line); cursor:pointer; transition:transform .06s;}
  .key:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line);}
  .key.fn{background:#E7EFF9; font-size:20px;}
  .key.go{grid-column:span 2; background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-deep); font-size:22px; letter-spacing:2px;}
  .key.go:disabled{opacity:.45;}

  .fb{margin-top:16px; border-radius:18px; padding:16px 18px; font-size:16px; line-height:1.65; animation:pop .25s;}
  @keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
  .fb.ok{background:#E4F8F0; border:2px solid var(--mint);}
  .fb.ng{background:#FDECEC; border:2px solid var(--coral);}
  .fb .fb-head{font-size:20px; font-weight:800; margin-bottom:6px;}
  .fb.ok .fb-head{color:#159A6E;} .fb.ng .fb-head{color:#D64F4F;}
  .boss-react{font-size:14px; color:#8896AC; margin-bottom:6px;}
  .counter-banner{background:#FFE8D6; border-radius:12px; padding:8px 12px; font-size:14px; font-weight:800; color:#C0501E; margin-bottom:8px;}
  .next-btn{display:block; width:100%; margin-top:14px; background:var(--sky); color:#fff; border:none; border-radius:16px; font-family:inherit; font-size:19px; font-weight:800; padding:15px 0; box-shadow:0 4px 0 #3E86BD; cursor:pointer;}
  .next-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #3E86BD;}

  /* ---------- result ---------- */
  .res-head{text-align:center; margin:18px 0 10px;}
  .res-emoji{font-size:52px;}
  .res-title{font-size:24px; font-weight:800; margin-top:8px;}
  .res-score{text-align:center; font-size:18px; margin-bottom:6px;}
  .res-score b{font-size:34px; color:var(--orange-deep);}
  .res-stars{text-align:center; font-size:26px; letter-spacing:4px; margin-bottom:14px;}
  .journey-card{background:var(--card); border-radius:20px; padding:18px 20px; margin-bottom:16px; box-shadow:0 4px 0 var(--line); text-align:center;}
  .journey-move{font-size:14px; color:#5B6B87; margin-bottom:8px;}
  .journey-nodes{display:flex; align-items:center; justify-content:center; gap:10px; font-size:30px;}
  .journey-arrow{font-size:18px; color:#8896AC;}
  .journey-newname{font-size:15px; font-weight:800; margin-top:6px;}
  .title-badge{display:inline-block; background:linear-gradient(135deg,var(--star),var(--orange)); color:#fff; font-size:14px; font-weight:800; border-radius:999px; padding:8px 18px; margin:4px 4px 12px; box-shadow:0 3px 0 var(--orange-deep);}
  .title-wrap{text-align:center;}

  .review-head{font-size:15px; font-weight:700; margin:8px 0 10px;}
  .review{background:var(--card); border-radius:18px; padding:16px 18px; margin-bottom:12px; box-shadow:0 4px 0 var(--line);}
  .review .rq{font-size:14.5px; font-weight:700; line-height:1.6;}
  .review .ra{font-size:14px; margin-top:6px; line-height:1.6;}
  .review .ra b{color:#159A6E;}
  .review .ra .miss{color:#D64F4F; font-weight:700;}
  .log-badge{display:inline-block; font-size:12px; font-weight:800; border-radius:999px; padding:3px 10px; margin-left:8px;}
  .log-badge.gold{background:#FFF3D0; color:#B8860B;}
  .log-badge.silver{background:#EFEFEF; color:#7A7A7A;}

  .savecode-card{background:#2A3550; color:#fff; border-radius:20px; padding:20px; margin:16px 0; text-align:center;}
  .savecode-label{font-size:13px; opacity:.8; margin-bottom:8px;}
  .savecode-text{font-size:19px; font-weight:800; letter-spacing:1px; word-break:break-all; background:rgba(255,255,255,.12); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .savecode-note{font-size:12.5px; opacity:.85; line-height:1.6;}

  .res-btns{display:flex; gap:12px; margin-top:16px;}
  .res-btns button{flex:1; font-family:inherit; font-size:17px; font-weight:800; padding:15px 0; border:none; border-radius:16px; cursor:pointer;}
  .retry{background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-deep);}
  .gohome{background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line);}

  .confirm-card{background:var(--card); border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:0 4px 0 var(--line); font-size:14.5px; line-height:1.8;}
  .confirm-btns{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .confirm-btns button{flex:1;}

  /* ---------- toast ---------- */
  #toast{position:fixed; left:0; right:0; bottom:14px; display:none; justify-content:center; padding:0 16px; z-index:50;}
  #toast.on{display:flex;}
  .toast-body{font-family:inherit; font-size:14px; font-weight:700; line-height:1.5; background:#2A3550; color:#fff; border:none; border-radius:14px; padding:12px 18px; box-shadow:0 4px 12px rgba(0,0,0,.25); cursor:pointer; max-width:100%;}

  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
(function(){
"use strict";

/* =====================================================================

   仕様: spec/spec_quest_v4_1.md(参照: spec_fukushu_quest_v3_1.md / spec_yoshu_quest_v1_3_1.md)
   ・エンジンとデータは分離。下記10ブロックのみ差し替え対象(build.mjs が注入)
   ・記録・通信なし。進捗はこの端末の localStorage にのみ保存される
   ===================================================================== */

/*==BANK_M_START==*/

/* ===== src/engine/util.js ===== */
/* =====================================================================
   engine/util.js — 汎用ユーティリティ・日付
   ===================================================================== */

function pad2(n){ return String(n).padStart(2, "0"); }

/* Fisher-Yates。rnd を差し替えられるようにしてテストから決定的に扱えるようにする */
function shuffle(arr, rnd){
  const r = rnd || Math.random;
  const b = [...arr];
  for(let i=b.length-1; i>0; i--){ const j = Math.floor(r()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; }
  return b;
}

function pick(arr, rnd){
  if(!arr || !arr.length) return "";
  const r = rnd || Math.random;
  return arr[Math.floor(r()*arr.length)];
}

/* ---------- 日付(state.last 用の "YYYY-MM-DD") ---------- */
function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function dateKey(d){
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}

function parseDateKey(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  if(!m) return null;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  return Number.isNaN(d.getTime()) ? null : d;
}

function daysBetween(from, to){
  return Math.floor((midnight(to) - midnight(from)) / 86400000);
}

/* HTMLエスケープ。バンクJSONは家庭内で編集されるがUIに素で流し込まないための保険 */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}


/* ===== src/engine/normalize.js ===== */
/* =====================================================================
   engine/normalize.js — 入力モード自動判定と答え合わせ用の正規化
   仕様: fukushu §6(予習エンジンも同一実装)
   ===================================================================== */

/* 全ての正答候補が数値/分数のときだけ数字キーパッドモード。
   それ以外(漢字・かな回答)はテキスト入力モード */
function isNumericQuestion(q){
  return q.ans.every(a => /^-?\d+(\.\d+)?$/.test(a) || /^\d+\/\d+$/.test(a));
}

function normZen(s){
  return s.replace(/[０-９．／]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}

function norm(s, numeric){
  const z = normZen(s);
  if(numeric){
    return z.replace(/[\s。、点円個こ回人gkmcページ]/g, "").trim();
  }
  /* テキストモード: 空白・句読点を除去し、カタカナ→ひらがなに折り畳んで比較
     (「すいさんかカルシウム」のようなかな交じり入力を正解にするため。答え側にも同じ正規化がかかる) */
  return z.replace(/[\s。、！？!?]/g, "")
          .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60))
          .trim();
}

function answerMatches(q, input){
  const numeric = isNumericQuestion(q);
  const okSet = new Set(q.ans.map(a => norm(a, numeric)));
  return okSet.has(norm(input, numeric));
}


/* ===== src/engine/savecode.js ===== */
/* =====================================================================
   engine/savecode.js — セーブコード V2(発行/復元)+ V1 互換読み込み
   仕様: fukushu §5 / v4.1 §4.4
   ・ビット列は retired 含む全問題(ALL_QS)の id 昇順(fukushu §5 教訓・必須確認項目)
   ・payload = 問題数(10bit) + 箱番号(2bit×問題数) + xp(12bit)
   ・v4.1 記録1(承認済): チェックサム算法は全科目 fukushu 版に統一する。
     旧 yoshu 版は sum*31 のハッシュだったが、旧予習コードは §8-3 により移行対象外。
   ・箱の既定値は科目系統ごとに据え置き(v4.1 記録3): 復習=箱2 / 予習=未出題(別管理)
   ===================================================================== */

const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

/* コード上で「箱の指定がない」問題をどう詰めるか。
   fukushu: 未出題=箱2 なので 2 で詰める / yoshu: 未出題は箱と別管理なので 0 で詰める */
const SAVE_PACK_DEFAULT = { fukushu: 2, yoshu: 0 };

function bitsFromInt(n, len){ return (n>>>0).toString(2).padStart(len, "0"); }

/* 状態文字列の各文字コード和 mod 32(fukushu §5) */
function checksum(str){
  let sum = 0;
  for(const ch of str) sum += ch.charCodeAt(0);
  return B32[sum % 32];
}

function todayDateStr(now){
  const d = now || new Date();
  return pad2(d.getFullYear()%100) + pad2(d.getMonth()+1) + pad2(d.getDate());
}

function parseCodeDateStr(dateStr){
  const yy = parseInt(dateStr.slice(0,2),10),
        mm = parseInt(dateStr.slice(2,4),10)-1,
        dd = parseInt(dateStr.slice(4,6),10);
  if(mm<0 || mm>11 || dd<1 || dd>31) return null;
  const d = new Date(2000+yy, mm, dd);
  return Number.isNaN(d.getTime()) ? null : d;
}

function bitsToB32(bits){
  let b = bits;
  while(b.length % 5 !== 0) b += "0";
  let out = "";
  for(let i=0; i<b.length; i+=5) out += B32[parseInt(b.substr(i,5),2)];
  return out;
}

function b32ToBits(str){
  let bits = "";
  for(const ch of str.toUpperCase()){
    const idx = B32.indexOf(ch);
    if(idx < 0) throw new Error("invalid char");
    bits += bitsFromInt(idx, 5);
  }
  return bits;
}

/* ---------- V1形式(問題数を持たない旧形式。互換読み込み専用。新規発行はしない) ---------- */
function packStateV1(allQs, boxes, xp, mode){
  const dflt = SAVE_PACK_DEFAULT[mode];
  let bits = "";
  allQs.forEach(q => { bits += bitsFromInt(boxes[q.id] ?? dflt, 2); });
  bits += bitsFromInt(Math.min(xp, 4095), 12);
  return bitsToB32(bits);
}

function unpackStateV1(str, allQs){
  const raw = b32ToBits(str);
  const needed = allQs.length*2 + 12;
  if(raw.length < needed) throw new Error("too short");
  const bits = raw.slice(0, needed);
  const boxes = {};
  allQs.forEach((q,i) => { boxes[q.id] = parseInt(bits.substr(i*2,2),2); });
  const xp = parseInt(bits.substr(allQs.length*2, 12), 2);
  return { boxes, xp };
}

/* ---------- V2形式(問題数を10bitで持つ。バンクが増えても古いコードを壊さない) ---------- */
function packStateV2(allQs, boxes, xp, mode){
  const dflt = SAVE_PACK_DEFAULT[mode];
  const n = allQs.length;
  let bits = bitsFromInt(n, 10);
  allQs.forEach(q => { bits += bitsFromInt(boxes[q.id] ?? dflt, 2); });
  bits += bitsFromInt(Math.min(xp, 4095), 12);
  return bitsToB32(bits);
}

function unpackStateV2(str){
  const raw = b32ToBits(str);
  if(raw.length < 10) throw new Error("too short");
  const n = parseInt(raw.substr(0,10), 2);
  const needed = 10 + n*2 + 12;
  if(raw.length < needed) throw new Error("too short");
  const bits = raw.slice(0, needed);
  const codeBoxes = [];
  for(let i=0; i<n; i++) codeBoxes.push(parseInt(bits.substr(10+i*2,2),2));
  const xp = parseInt(bits.substr(10+n*2,12), 2);
  return { n, codeBoxes, xp };
}

/* V2のcodeBoxes(コード作成時点でのid昇順n件)を現在のALL_QSへ写像。
   増えた分(現在の問題数 − n)は「未出題」として初期化する。
   ・fukushu: 未出題=箱2 なので 2 を書き込む
   ・yoshu:   未出題はキー未設定で表現するので書き込まない */
function applyV2Code(decoded, allQs, mode){
  if(decoded.n > allQs.length) return { error: "bank_old" };
  const boxes = {};
  allQs.forEach((q,i) => {
    if(i < decoded.n) boxes[q.id] = decoded.codeBoxes[i];
    else if(mode === "fukushu") boxes[q.id] = 2;
  });
  return { boxes, xp: decoded.xp };
}

function makeSaveCode(allQs, boxes, xp, mode, now){
  const state = packStateV2(allQs, boxes, xp, mode);
  return `V2-${todayDateStr(now)}-${state}${checksum(state)}`;
}

function parseSaveCode(raw, allQs, mode){
  const code = (raw || "").trim().toUpperCase();

  let m = code.match(/^V2-(\d{6})-([A-Z2-7]+)$/);
  if(m){
    const body = m[2];
    if(body.length < 2) return null;
    const state = body.slice(0,-1), chk = body.slice(-1);
    if(checksum(state) !== chk) return null;
    let decoded;
    try{ decoded = unpackStateV2(state); }catch(e){ return null; }
    const applied = applyV2Code(decoded, allQs, mode);
    if(applied.error) return { error: applied.error };
    const savedDate = parseCodeDateStr(m[1]);
    if(!savedDate) return null;
    return { boxes: applied.boxes, xp: applied.xp, savedDate, version: "V2" };
  }

  /* 旧V1コードの互換読み込み。現在の問題数を前提にチェックサム照合するベストエフォート方式 */
  m = code.match(/^V1-(\d{6})-([A-Z2-7]+)$/);
  if(m){
    const body = m[2];
    if(body.length < 2) return null;
    const state = body.slice(0,-1), chk = body.slice(-1);
    if(checksum(state) !== chk) return null;
    let decoded;
    try{ decoded = unpackStateV1(state, allQs); }catch(e){ return null; }
    const savedDate = parseCodeDateStr(m[1]);
    if(!savedDate) return null;
    return { boxes: decoded.boxes, xp: decoded.xp, savedDate, version: "V1" };
  }

  return null;
}


/* ===== src/engine/leitner.js ===== */
/* =====================================================================
   engine/leitner.js — ライトナー式スケジュールとセッション構成
   仕様: fukushu §4(3/7/21日)/ yoshu §6(圧縮 0/1/3日)/ v4.1 §4.3(問題別 last 基準)
   ===================================================================== */

const INTERVALS = {
  fukushu: { 0:0, 1:3, 2:7, 3:21 },
  yoshu:   { 0:0, 1:1, 2:3,  3:3 }
};

const SESSION_SIZE = 8;
const REVIEW_SLOTS = 4;

/* v4.1 §4.3: 期日 = last[id] + 箱の間隔。last が無い問題は期日計算の対象外(未出題プールへ) */
function isDueByLast(box, lastStr, today, intervals){
  const last = parseDateKey(lastStr);
  if(!last) return false;
  return daysBetween(last, today) >= (intervals[box] ?? 0);
}

/* ---------- ふくしゅう(M/R/S/K)のセッション構成 ----------
   fukushu §4:
     間口(cat)選択時: リベンジ(箱0)は間口に関係なく最大2問混入
       → 期日到来の復習(間口内)→ 残りを間口内から補完(不足時のみ全体から)
     🎲おまかせミックス: 箱0は最大4問
   v4.1 記録4(承認済): 箱0の間口またぎは復習側の現行挙動を据え置く
   箱3も期日到来(21日)で必ず候補に含める(fukushu v2.1 の必須挙動)             */
function buildSessionFukushu(liveQs, state, cat, today, rnd){
  const boxes = state.boxes || {}, last = state.last || {};
  const iv = INTERVALS.fukushu;
  const inCat = q => !cat || q.cat === cat;

  const pool0=[], due1=[], due2=[], due3=[];
  liveQs.forEach(q => {
    const box = boxes[q.id] ?? 2;              // 復習の未出題は箱2扱い(v4.1 記録3)
    if(box === 0) pool0.push(q);               // リベンジは間口に関係なく候補
    else if(box === 1 && inCat(q) && isDueByLast(1, last[q.id], today, iv)) due1.push(q);
    else if(box === 2 && inCat(q) && isDueByLast(2, last[q.id], today, iv)) due2.push(q);
    else if(box === 3 && inCat(q) && isDueByLast(3, last[q.id], today, iv)) due3.push(q);
  });

  const revCap = cat ? 2 : 4;
  const review = [
    ...shuffle(pool0, rnd).slice(0, revCap),
    ...shuffle(due1, rnd), ...shuffle(due2, rnd), ...shuffle(due3, rnd)
  ].slice(0, REVIEW_SLOTS);

  const revengeIds = new Set(pool0.map(q => q.id));
  const usedIds = new Set(review.map(q => q.id));
  const catPool = shuffle(liveQs.filter(q => !usedIds.has(q.id) && inCat(q)), rnd);
  const anyPool = shuffle(liveQs.filter(q => !usedIds.has(q.id) && !inCat(q)), rnd);
  const needed = Math.max(0, SESSION_SIZE - review.length);
  const fill = [...catPool, ...anyPool].slice(0, needed);   // 間口内で足りなければ全体から補完

  return shuffle([...review, ...fill], rnd)
    .map(q => ({ ...q, _revenge: revengeIds.has(q.id) }));
}

/* ---------- じゅんび(Y)のセッション構成 ----------
   yoshu §6 v1.3.1(間口の純粋化):
     間口(科目)を選んだ場合、箱0・期日到来の復習・未出題・補完のすべてを間口内に限定する。
     間口内の解放済み問題が8問に満たない場合はセッションを短縮し、他科目では埋めない。
     🎲おまかせミックス(cat=null)のみ全科目を母数とする。
   優先順: 箱0(最大2/4問)→ 期日到来の復習 → 未出題 → 間口内の残りで補完
   未解放の回の問題は候補に含めない(§5。unlockedQs で渡す)
   「未出題」は boxes[id] が存在しないことで判定(0=直近誤答と明確に区別。v4.1 記録3)  */
function buildSessionYoshu(unlockedQs, state, cat, today, rnd){
  const boxes = state.boxes || {}, last = state.last || {};
  const iv = INTERVALS.yoshu;

  const UQS = unlockedQs.filter(q => !cat || q.cat === cat);   // 先に間口で絞り込む
  const pool0=[], due1=[], due2=[], due3=[], unseen=[];
  UQS.forEach(q => {
    const box = boxes[q.id];
    if(box === undefined) unseen.push(q);
    else if(box === 0) pool0.push(q);
    else if(box === 1 && isDueByLast(1, last[q.id], today, iv)) due1.push(q);
    else if(box === 2 && isDueByLast(2, last[q.id], today, iv)) due2.push(q);
    else if(box === 3 && isDueByLast(3, last[q.id], today, iv)) due3.push(q);
  });

  const revCap = cat ? 2 : 4;
  const review = [
    ...shuffle(pool0, rnd).slice(0, revCap),
    ...shuffle(due1, rnd), ...shuffle(due2, rnd), ...shuffle(due3, rnd)
  ].slice(0, REVIEW_SLOTS);

  const revengeIds = new Set(pool0.map(q => q.id));
  const usedIds = new Set(review.map(q => q.id));
  const needed = Math.max(0, SESSION_SIZE - review.length);
  const fill = shuffle(unseen.filter(q => !usedIds.has(q.id)), rnd).slice(0, needed);

  let session = [...review, ...fill];
  if(session.length < SESSION_SIZE){
    /* 全問マスター済み等で足りない場合は、間口内の残り(期日前の問題)から補完 */
    const usedAll = new Set(session.map(q => q.id));
    session = [...session,
      ...shuffle(UQS.filter(q => !usedAll.has(q.id)), rnd).slice(0, SESSION_SIZE - session.length)];
  }

  return shuffle(session, rnd)
    .map(q => ({ ...q, _revenge: revengeIds.has(q.id) }));
}

/* 正誤確定時の箱遷移。正解→箱+1(上限3)、誤答→箱0 */
function nextBox(curBox, ok, mode){
  const base = curBox === undefined ? (mode === "fukushu" ? 2 : 0) : curBox;
  return ok ? Math.min(base+1, 3) : 0;
}


/* ===== src/engine/validate.js ===== */
/* =====================================================================
   engine/validate.js — バンク/スキンのバリデーション
   仕様: v4.1 §6(fukushu §7 を土台に科目分岐)/ yoshu §8
   ・不合格は更新拒否+理由表示、現行バンク維持(全科目共通)
   ===================================================================== */

const YOSHU_REQUIRED_CATS = ["算数", "国語", "社会", "理科"];

/* ---------- 図版(SVG)の検査 — v4.2 §5.2 / §6 ----------
   svg は任意フィールド。無い問題は従来どおり(後方互換)。
   ここは文字列レベルの門前払い。描画直前にはホワイトリスト方式の
   サニタイズ(ui/quiz.js の sanitizeSvg)がもう一段かかる。
   不合格なら理由文字列、問題なければ null を返す。                    */
function svgFieldError(svg){
  if(svg === undefined || svg === null) return null;          // 未指定はOK
  if(typeof svg !== "string") return "svgは文字列で指定してください";
  const s = svg.trim();
  if(!s) return "svgが空です";
  if(!/^<svg[\s>]/i.test(s))  return "svgは <svg で始まる必要があります";
  if(!/<\/svg>$/i.test(s))    return "svgは </svg> で終わる必要があります";
  if(/<script[\s>]/i.test(s)) return "svgに script は含められません";
  if(/<foreignObject[\s>]/i.test(s)) return "svgに foreignObject は含められません";
  if(/<\s*(iframe|embed|object|animate|set)[\s>]/i.test(s)) return "svgに埋め込み・アニメーション要素は含められません";
  if(/\son[a-z]+\s*=/i.test(s)) return "svgにイベント属性(on*)は含められません";
  if(/javascript\s*:/i.test(s)) return "svgに javascript: は含められません";

  /* 外部参照の禁止(オフライン原則 §7)。フラグメント参照(#id)のみ許可 */
  const refs = s.match(/(?:xlink:)?href\s*=\s*(["'])([\s\S]*?)\1/gi) || [];
  for(const r of refs){
    const v = (/(["'])([\s\S]*?)\1/.exec(r) || [])[2] || "";
    if(!v.trim().startsWith("#")) return "svgに外部参照(href)は含められません";
  }
  if(/url\s*\(\s*["']?\s*(?!#)/i.test(s)) return "svgに外部リソース参照(url())は含められません";
  return null;
}

/* v4.3 §6: セキュリティ規則に違反する svg は、バンク全体を拒否せず
   **当該問題の svg だけを破棄**して図なしで採用する。
   図は提示専用の補助データなので、破棄すれば描画されず安全。
   図1枚の不備で月次バンク更新を差し戻さないための措置。
   戻り値: { bank(破棄済み), warnings[] }                            */
function stripUnsafeSvg(bank){
  const warnings = [];
  if(!bank || !Array.isArray(bank.questions)) return { bank, warnings };
  let changed = false;
  const questions = bank.questions.map(q => {
    if(!q || q.svg === undefined || q.svg === null) return q;
    const err = svgFieldError(q.svg);
    if(!err) return q;
    warnings.push(`${q.id}: ${err}`);
    changed = true;
    const copy = { ...q };
    delete copy.svg;
    return copy;
  });
  return { bank: changed ? { ...bank, questions } : bank, warnings };
}

/* 起動時の構造チェック(内蔵バンク・localStorageキャッシュの読み込み用)。
   §5 の空バンク bank_K を通すため questions は空配列を許容する
   (おうちの人メニューからの投入では validateBankPaste が 1問以上を要求する) */
function validateBankObj(b, subject){
  if(!b || typeof b !== "object") return false;
  if(b.subject !== subject) return false;
  if(!Array.isArray(b.cats)) return false;
  if(!Array.isArray(b.questions)) return false;
  /* v4.3: 図版の不備でバンクを不採用にはしない。危険な svg は
     stripUnsafeSvg() が採用時に破棄する(図が出ないだけで問題は解ける) */
  return b.questions.every(q =>
    q && q.id && q.q && q.cat && Array.isArray(q.ans) && q.ans.length > 0);
}

function validateSkinObj(s, kind){
  if(!s || !s.colors || !Array.isArray(s.praise) || !Array.isArray(s.cheer)) return false;
  if(!s.hintPraise) return false;                       // ヒント称賛文化(fukushu §3 必須要件)
  if(kind === "boss"){
    return !!(s.boss && s.boss.name && s.boss.emoji && s.boss.lines &&
      s.boss.lines.appear && Array.isArray(s.boss.lines.damage) && s.boss.lines.damage.length > 0 &&
      s.boss.lines.sealBreak && s.boss.lines.defeat && s.boss.lines.escape);
  }
  return !!(s.map && Array.isArray(s.map.nodes) && s.map.nodes.length > 0 && Array.isArray(s.titles));
}

/* ans規則の共通判定。テキスト解答は2表記以上が必要かどうかを返す
   ・K(国語)は全問スキップ(v4.1 §5: 読み=ひらがな1種 / 書き=漢字1種)
   ・Y は cat が「国語」の問題のみスキップ(yoshu §2 v1.1 の例外) */
function ansNeedsTwoForms(q, subject){
  if(isNumericQuestion(q)) return false;
  if(subject === "K") return false;
  if(subject === "Y" && q.cat === "国語") return false;
  return true;
}

/* ---------- M/R/S/K(永続バンク) ---------- */
function validateBankPasteFukushu(text, subject, existingIds){
  let c;
  try{ c = JSON.parse(text); }
  catch(e){ return { ok:false, reason:"JSONとして読み取れませんでした。貼り付け内容を確認してください。" }; }

  if(!c || typeof c !== "object") return { ok:false, reason:"バンクの形式が正しくありません。" };
  if(c.subject !== subject){
    return { ok:false, reason:`subjectが一致しません(この枠は "${subject}" 用です)。` };
  }
  if(!Array.isArray(c.questions) || c.questions.length === 0){
    return { ok:false, reason:"questions配列が見つかりません(1問以上必要です)。" };
  }
  if(!Array.isArray(c.cats) || c.cats.length === 0){
    return { ok:false, reason:"cats(間口の定義)がありません。" };
  }

  const catNames = new Set(c.cats.map(x => x && x.cat));
  const idRe = new RegExp("^" + subject + "\\d{4}$");
  const ids = [];
  for(const q of c.questions){
    if(!q || !q.id || !idRe.test(q.id)){
      return { ok:false, reason:`不正なid形式があります: ${q && q.id}(${subject}+4桁の形式にしてください)` };
    }
    if(!q.cat) return { ok:false, reason:`catが未設定の問題があります(id: ${q.id})。` };
    if(!catNames.has(q.cat)){
      return { ok:false, reason:`catsに定義されていないcatがあります(id: ${q.id} / cat: ${q.cat})。` };
    }
    if(!Array.isArray(q.ans) || q.ans.length === 0){
      return { ok:false, reason:`ansが未設定の問題があります(id: ${q.id})。` };
    }
    if(ansNeedsTwoForms(q, subject) && q.ans.length < 2){
      return { ok:false, reason:`テキスト回答は漢字+ひらがな等、2種類以上のans表記が必要です(id: ${q.id})。` };
    }
    ids.push(q.id);
  }

  const idSet = new Set(ids);
  if(idSet.size !== ids.length) return { ok:false, reason:"idが重複しています。" };

  /* id永続: 既存idの欠落は禁止(外したい場合は retired で残置) */
  const missing = (existingIds || []).filter(id => !idSet.has(id));
  if(missing.length){
    return { ok:false, reason:`既存のidが欠落しています(削除は禁止・外したい場合はretiredで対応): ${missing.slice(0,5).join("、")}${missing.length>5?" 他":""}` };
  }

  /* 新規idは既存の続き番号 */
  const numSuffix = id => parseInt(id.slice(subject.length), 10);
  const existingMax = (existingIds || []).length ? Math.max(...existingIds.map(numSuffix)) : 0;
  const badNew = ids.filter(id => !(existingIds || []).includes(id) && numSuffix(id) <= existingMax);
  if(badNew.length){
    return { ok:false, reason:`新規idは既存の続き番号にしてください(番号が既存以下のid: ${badNew.slice(0,5).join("、")})。` };
  }

  /* v4.3 §6: 不正な図版はバンクを拒否せず、当該svgのみ破棄して採用する */
  const stripped = stripUnsafeSvg(c);
  return { ok:true, bank:stripped.bank, svgWarnings:stripped.warnings };
}

/* ---------- Y(サイクル使い捨てバンク) ---------- */
function validateBankPasteYoshu(text){
  let c;
  try{ c = JSON.parse(text); }
  catch(e){ return { ok:false, reason:"JSONとして読み取れませんでした。貼り付け内容を確認してください。" }; }

  if(!c || typeof c !== "object") return { ok:false, reason:"バンクの形式が正しくありません。" };
  if(c.subject !== "Y"){
    return { ok:false, reason:`subjectが一致しません(この枠は "Y"(4科統合)用です)。` };
  }
  if(!c.testDate || !/^\d{4}-\d{2}-\d{2}$/.test(c.testDate)){
    return { ok:false, reason:"testDateがISO日付(YYYY-MM-DD形式)で設定されていません。" };
  }
  if(!Array.isArray(c.questions) || c.questions.length === 0){
    return { ok:false, reason:"questions配列が見つかりません。" };
  }
  if(!Array.isArray(c.cats) || !YOSHU_REQUIRED_CATS.every(rc => c.cats.some(x => x && x.cat === rc))){
    return { ok:false, reason:"catsに4科(算数・国語・社会・理科)すべてが定義されている必要があります。" };
  }

  const idRe = /^Y\d{4}$/;
  const idSet = new Set();
  for(const q of c.questions){
    if(!q || !q.id || !idRe.test(q.id)){
      return { ok:false, reason:`不正なid形式があります: ${q && q.id}(Y+4桁の形式にしてください)` };
    }
    if(idSet.has(q.id)) return { ok:false, reason:`idが重複しています: ${q.id}` };
    idSet.add(q.id);
    if(!q.cat || !YOSHU_REQUIRED_CATS.includes(q.cat)){
      return { ok:false, reason:`catが4科(算数/国語/社会/理科)のいずれでもない問題があります(id: ${q.id})。` };
    }
    if(!Array.isArray(q.ans) || q.ans.length === 0){
      return { ok:false, reason:`ansが未設定の問題があります(id: ${q.id})。` };
    }
    if(ansNeedsTwoForms(q, "Y") && q.ans.length < 2){
      return { ok:false, reason:`テキスト回答は漢字+ひらがな等、2種類以上のans表記が必要です(id: ${q.id})。国語の漢字問題のみ1種可。` };
    }
  }
  /* サイクル使い捨てのため既存バンクとの連続性チェックは行わない(yoshu §8) */
  const stripped = stripUnsafeSvg(c);
  return { ok:true, bank:stripped.bank, svgWarnings:stripped.warnings };
}

function validateBankPaste(text, subject, existingIds){
  return subject === "Y"
    ? validateBankPasteYoshu(text)
    : validateBankPasteFukushu(text, subject, existingIds);
}

function validateSkinPaste(text, kind){
  let c;
  try{ c = JSON.parse(text); }
  catch(e){ return { ok:false, reason:"JSONとして読み取れませんでした。貼り付け内容を確認してください。" }; }
  if(!validateSkinObj(c, kind)){
    return { ok:false, reason: kind === "boss"
      ? "スキンの必須項目(boss.name/emoji/lines、colors、praise、cheer、hintPraise)が不足しています。"
      : "スキンの必須項目(colors、praise、cheer、hintPraise、map.nodes、titles)が不足しています。" };
  }
  return { ok:true, skin:c };
}


/* ===== src/engine/storage.js ===== */
/* =====================================================================
   engine/storage.js — localStorage の可否判定と安全な読み書き
   仕様: v4.1 §3 / §4.1(書き込み失敗時はバナー+セーブコード導線)
   ===================================================================== */

let storageAvailable = false;
let storageWriteFailed = false;      // 一度でも書き込みに失敗したら true(常時バナーの根拠)

function probeStorage(){
  try{
    localStorage.setItem("__quest_probe__", "1");
    localStorage.removeItem("__quest_probe__");
    storageAvailable = true;
  }catch(e){
    storageAvailable = false;
  }
  return storageAvailable;
}

function lsGetJSON(key){
  if(!storageAvailable) return null;
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function lsSetJSON(key, value){
  if(!storageAvailable){ storageWriteFailed = true; return false; }
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){
    storageWriteFailed = true;      // 容量超過など
    return false;
  }
}

function lsRemove(key){
  if(!storageAvailable) return;
  try{ localStorage.removeItem(key); }catch(e){}
}

/* v4.1 §3 のキー */
function keyState(subject){ return "quest_state_" + subject; }
function keyBank(subject){ return "quest_bank_" + subject; }
function keySkin(slot){ return "quest_skin_" + slot; }        // slot: M/R/S/K/BOSS
const KEY_BOSS_LOG  = "quest_boss_log_Y";
const KEY_UNLOCK    = "quest_unlock_Y";
const KEY_LAST_VIEW = "quest_last_view";


/* ===== src/engine/state.js ===== */
/* =====================================================================
   engine/state.js — 自動保存する進捗 state(v4.1 §4.2 / §4.3)
   {
     "v": 1, "bankVersion": "M_2026_07_02",
     "boxes": {"M0001": 2}, "last": {"M0001": "2026-07-26"}, "xp": 123
   }
   ・boxes: キーが無いid = 未出題(復習=箱2初期扱い / 予習=未出題別管理)
   ・last : その問題に最後に解答した日(期日計算に使用)
   ===================================================================== */

const STATE_VERSION = 1;

function emptyState(bankVersion){
  return { v: STATE_VERSION, bankVersion: bankVersion || "", boxes: {}, last: {}, xp: 0 };
}

function isValidState(s){
  return !!(s && s.v === STATE_VERSION && s.boxes && typeof s.boxes === "object" &&
            s.last && typeof s.last === "object" && typeof s.xp === "number");
}

/* §4.2 起動時の突合。バンクが成長していれば新規idは「未出題」として扱う。
   未出題は boxes にキーが無い状態そのものなので、追加操作は不要
   (復習側は参照時に箱2として解決する)。現バンクに存在しないidは持ち越さない。 */
function reconcileState(state, bank){
  const ids = new Set((bank.questions || []).map(q => q.id));
  const boxes = {}, last = {};
  Object.keys(state.boxes || {}).forEach(id => { if(ids.has(id)) boxes[id] = state.boxes[id]; });
  Object.keys(state.last  || {}).forEach(id => { if(ids.has(id)) last[id]  = state.last[id]; });
  return { v: STATE_VERSION, bankVersion: bank.bankVersion || "", boxes, last, xp: state.xp || 0 };
}

function loadState(subject, bank){
  const raw = lsGetJSON(keyState(subject));
  if(!isValidState(raw)) return emptyState(bank.bankVersion);
  return reconcileState(raw, bank);
}

function saveState(subject, state){
  return lsSetJSON(keyState(subject), state);
}

/* 解答確定時の state 更新(§4.1: これを呼んだ直後に saveState する) */
function recordAnswer(state, q, ok, mode, today){
  state.boxes[q.id] = nextBox(state.boxes[q.id], ok, mode);
  state.last[q.id]  = dateKey(today || new Date());
  if(ok) state.xp = Math.min((state.xp || 0) + 1, 4095);
  return state;
}

/* §4.3: セーブコードから復元した場合のみ、全問の last を復元日で一括初期化する
   (コードは日付を持たないため。従来挙動と同等) */
function applyRestoredCode(state, parsed, bank, restoreDate){
  const day = dateKey(restoreDate || new Date());
  const last = {};
  Object.keys(parsed.boxes).forEach(id => { last[id] = day; });
  return {
    v: STATE_VERSION,
    bankVersion: bank.bankVersion || "",
    boxes: { ...parsed.boxes },
    last,
    xp: parsed.xp || 0
  };
}


/* ===== src/engine/adopt.js ===== */
/* =====================================================================
   engine/adopt.js — バンク・スキンの採用規則(v4.1 §3.1)
   bankVersion の新旧比較(順序判定)は行わない。等値判定のみで決める。

   localStorage の値の形: { data: <bank|skin>, builtinVersion: "<投入時点の内蔵version>" }

   起動時:
     1. 投入なし                                   → 内蔵を使用
     2. 投入あり & 内蔵version == 記録されたversion → 投入を使用(再起動をまたいで有効)
     3. 投入あり & 内蔵versionが記録と異なる        → 内蔵に切替+投入解除+トースト通知
   例外: bank_Y の 3 は無条件に実行せず、§7.1 のサイクル交代確認フローへ回す
   ===================================================================== */

function readAdopted(storageKey){
  const stored = lsGetJSON(storageKey);
  if(!stored || typeof stored !== "object" || !stored.data) return null;
  return stored;
}

function writeAdopted(storageKey, data, builtinVersion){
  return lsSetJSON(storageKey, { data, builtinVersion });
}

function clearAdopted(storageKey){ lsRemove(storageKey); }

/**
 * @param storageKey  quest_bank_* / quest_skin_*
 * @param builtin     内蔵リソース
 * @param versionOf   リソース→version文字列
 * @param isValid     リソース→boolean(壊れたキャッシュを弾く)
 * @param deferSwitch true なら規則3を実行せず pendingSwitch を返す(bank_Y 用)
 * @returns { value, source:"builtin"|"local", switched, pendingSwitch, warning }
 */
function adoptResource(storageKey, builtin, versionOf, isValid, deferSwitch){
  const builtinVersion = versionOf(builtin);
  const stored = readAdopted(storageKey);

  if(!stored){
    return { value: builtin, source: "builtin", switched: false, pendingSwitch: null, warning: null };
  }
  if(!isValid(stored.data)){
    clearAdopted(storageKey);
    return { value: builtin, source: "builtin", switched: false, pendingSwitch: null,
             warning: "保存されていたデータが壊れていたため、内蔵版で起動しています。" };
  }
  if(stored.builtinVersion === builtinVersion){
    return { value: stored.data, source: "local", switched: false, pendingSwitch: null, warning: null };
  }
  /* 内蔵が push で更新された */
  if(deferSwitch){
    return { value: stored.data, source: "local", switched: false, pendingSwitch: builtin, warning: null };
  }
  clearAdopted(storageKey);
  return { value: builtin, source: "builtin", switched: true, pendingSwitch: null, warning: null };
}


/* ===== src/engine/boss.js ===== */
/* =====================================================================
   engine/boss.js — じゅんび(Y)固有の導出: HP・マスター率・封印・解放ゲート・討伐記録
   仕様: yoshu §4(v1.2 部分点HP)/ §5(回単位の解放ゲート)
   状態の二重管理をしない原則: HP・各種率は常に箱から導出する
   ===================================================================== */

const SEAL_THRESHOLD = 80;

/* マスター率(封印解除・討伐判定用・厳密定義): 箱2以上のlive問題数 ÷ live問題数 × 100 */
function masteredCount(qs, boxes){
  return qs.filter(q => (boxes[q.id] ?? -1) >= 2).length;
}
function masteryPctOf(qs, boxes){
  return qs.length ? Math.round(masteredCount(qs, boxes) / qs.length * 100) : 0;
}

/* 進捗率(HP用・部分点 v1.2): 箱2以上=1.0pt / 箱1=0.5pt / 箱0・未出題=0pt
   v1.3: 母数は「解放済みの回」の問題のみ */
function progressPct(qs, boxes){
  if(!qs.length) return 0;
  let pts = 0;
  qs.forEach(q => {
    const b = boxes[q.id] ?? -1;
    if(b >= 2) pts += 1;
    else if(b === 1) pts += 0.5;
  });
  return Math.round(pts / qs.length * 100);
}

function bossHP(qs, boxes){ return 100 - progressPct(qs, boxes); }

/* ---------- 回単位の解放ゲート(yoshu §5) ----------
   各科目の回はバンクの kai から自動検出。初期状態は各科目の最初の回のみ解放。
   解放状態は localStorage に保存するが、消えても自己修復する:
     ①各科目の最初の回は常に解放  ②箱に進捗がある回は解放済みとみなす            */
function kaisOf(liveQs, cat){
  return [...new Set(liveQs.filter(q => q.cat === cat).map(q => q.kai))].sort((a,b) => a-b);
}

function loadStoredUnlocks(){
  const v = lsGetJSON(KEY_UNLOCK);
  return Array.isArray(v) ? v : [];
}
function saveStoredUnlocks(list){ lsSetJSON(KEY_UNLOCK, list); }

function unlockedKeys(liveQs, cats, boxes){
  const set = new Set(loadStoredUnlocks());
  cats.forEach(c => { const ks = kaisOf(liveQs, c.cat); if(ks.length) set.add(c.cat + ":" + ks[0]); });
  liveQs.forEach(q => { if(boxes[q.id] !== undefined) set.add(q.cat + ":" + q.kai); });
  return set;
}
function unlockedQsOf(liveQs, keys){ return liveQs.filter(q => keys.has(q.cat + ":" + q.kai)); }
function allKaisUnlocked(liveQs, keys){ return liveQs.every(q => keys.has(q.cat + ":" + q.kai)); }

function unlockKai(cat, kai){
  const list = loadStoredUnlocks();
  const k = cat + ":" + kai;
  if(!list.includes(k)){ list.push(k); saveStoredUnlocks(list); }
}
function clearUnlocks(){ lsRemove(KEY_UNLOCK); }

/* ---------- 討伐記録(quest_boss_log_Y) ----------
   消えても被害なしのキャッシュ扱い。storage不可時はセッション内メモリで代替 */
let bossLogMemory = [];

function loadBossLog(){
  const v = lsGetJSON(KEY_BOSS_LOG);
  return Array.isArray(v) ? v : bossLogMemory;
}

function saveBossLogEntry(entry){
  const log = loadBossLog();
  log.push(entry);
  bossLogMemory = log;
  lsSetJSON(KEY_BOSS_LOG, log);
}

/* サイクル交代時の記録(yoshu §4 / v4.1 §7.1-2a)。
   mastery は未解放の回も分母に含む全問題ベースの厳密値 */
function buildBossLogEntry(skin, bank, liveQs, boxes){
  const finalMastery = masteryPctOf(liveQs, boxes);
  return {
    bossName: (skin.boss && skin.boss.name) || "-",
    emoji:    (skin.boss && skin.boss.emoji) || "",
    testDate: bank.testDate || "-",
    result:   finalMastery >= 100 ? "討伐" : "取り逃がし",
    mastery:  finalMastery
  };
}


/* ===== src/engine/titles.js ===== */
/* =====================================================================
   engine/titles.js — 称号判定とマップ計算
   仕様: fukushu §3
   ・称号condはエンジン実装済みの条件名のみ使用可
     (noHintStreakN / hintCorrectN / revengeWin / perfectStage / totalCorrectN)
   ・称号は永続化せず、セッション内スタッツ+累計xpで毎回判定(「今回獲得」表示)
   ===================================================================== */

function condMet(cond, stats, totalXp){
  if(cond.startsWith("noHintStreak")) return stats.noHintMaxStreak >= parseInt(cond.replace("noHintStreak",""),10);
  if(cond.startsWith("hintCorrect"))  return stats.hintCorrectCount >= parseInt(cond.replace("hintCorrect",""),10);
  if(cond === "revengeWin")   return !!stats.revengeWin;
  if(cond === "perfectStage") return !!stats.perfectStage;
  if(cond.startsWith("totalCorrect")) return totalXp >= parseInt(cond.replace("totalCorrect",""),10);
  return false;
}

function earnedTitles(skin, stats, totalXp){
  return (skin.titles || []).filter(t => condMet(t.cond, stats, totalXp));
}

/* map.nodes は最大60。総正解数(xp)で現在地を算出 */
function nodeIndexForXp(xp, map){
  const nodes = map.nodes;
  const step = map.stepPerCorrect || 1;
  return Math.min(Math.floor(xp / step), nodes.length - 1);
}

/* ===== src/ui/svg.js ===== */
/* =====================================================================
   ui/svg.js — 図版(SVG)のサニタイズと描画 — v4.2 §5.2
   ・図は「問題の提示専用」。操作・解答には一切使わない
   ・バンク投入時の文字列検査(engine/validate.js の svgFieldError)に加えて、
     描画直前にホワイトリスト方式で組み立て直す二段構え。
     バンクJSONは家庭内で編集されるため、通ってしまった記述があっても
     許可した要素・属性以外は DOM に載らない。
   ・外部参照は禁止(オフライン原則 §7)。href はフラグメント(#id)のみ許可
   ===================================================================== */

const SVG_NS = "http://www.w3.org/2000/svg";

/* 図形・テキスト・マーカーまわりに限定。image/script/foreignObject 等は含めない */
const SVG_ALLOWED_TAGS = new Set([
  "svg","g","defs","title","desc","style",
  "path","line","polyline","polygon","rect","circle","ellipse",
  "text","tspan","marker","use","symbol",
  "linearGradient","radialGradient","stop","clipPath","pattern"
]);

const SVG_ALLOWED_ATTRS = new Set([
  "viewbox","xmlns","preserveaspectratio","width","height","id","class","transform",
  "d","points","x","y","dx","dy","x1","y1","x2","y2","cx","cy","r","rx","ry",
  "fill","fill-opacity","fill-rule","stroke","stroke-width","stroke-opacity",
  "stroke-dasharray","stroke-linecap","stroke-linejoin","stroke-miterlimit",
  "opacity","color","font-size","font-family","font-weight","font-style",
  "text-anchor","dominant-baseline","alignment-baseline","letter-spacing",
  "marker-start","marker-mid","marker-end","orient","refx","refy",
  "markerwidth","markerheight","markerunits","offset","stop-color","stop-opacity",
  "gradientunits","patternunits","clip-path","clip-rule","vector-effect",
  "spreadmethod","fx","fy","overflow","style","xml:space"
]);

/* style 属性・<style> 要素に外部参照や式が紛れていないか */
function svgStyleIsSafe(v){
  return !/url\s*\(|@import|expression\s*\(|javascript\s*:|behavior\s*:/i.test(String(v));
}

function svgCleanNode(src, doc, depth){
  if(depth > 24) return null;                       // 異常に深い入れ子は捨てる
  const tag = src.nodeName.toLowerCase();
  if(!SVG_ALLOWED_TAGS.has(tag)) return null;

  const el = doc.createElementNS(SVG_NS, tag);
  for(const at of Array.from(src.attributes || [])){
    const name = at.name.toLowerCase();
    const val = at.value;
    if(name.startsWith("on")) continue;                       // イベント属性
    if(name === "href" || name === "xlink:href"){
      if(!String(val).trim().startsWith("#")) continue;       // 外部参照は落とす
      el.setAttribute("href", val);
      continue;
    }
    if(!SVG_ALLOWED_ATTRS.has(name)) continue;
    if(name === "style" && !svgStyleIsSafe(val)) continue;
    if(/url\s*\(\s*(?!["']?#)/i.test(val)) continue;          // 外部リソース参照
    el.setAttribute(at.name, val);
  }

  for(const child of Array.from(src.childNodes)){
    if(child.nodeType === 3){                                  // テキスト
      if(tag === "style" && !svgStyleIsSafe(child.nodeValue)) continue;
      el.appendChild(doc.createTextNode(child.nodeValue));
    } else if(child.nodeType === 1){
      const c = svgCleanNode(child, doc, depth+1);
      if(c) el.appendChild(c);
    }
    /* コメント・CDATA・処理命令は捨てる */
  }
  return el;
}

/* 生のSVG文字列 → 安全なSVGマークアップ。使えないときは null */
function sanitizeSvg(raw){
  if(typeof raw !== "string" || !raw.trim()) return null;
  if(typeof DOMParser === "undefined") return null;
  let doc;
  try{ doc = new DOMParser().parseFromString(raw.trim(), "image/svg+xml"); }
  catch(e){ return null; }
  if(!doc || doc.getElementsByTagName("parsererror").length) return null;
  const root = doc.documentElement;
  if(!root || root.nodeName.toLowerCase() !== "svg") return null;

  const out = svgCleanNode(root, document, 0);
  if(!out) return null;

  /* 拡縮の基準として viewBox を必須にする */
  const vb = (out.getAttribute("viewBox") || "").trim().split(/[\s,]+/).map(Number);
  if(vb.length !== 4 || vb.some(n => !Number.isFinite(n)) || vb[2] <= 0 || vb[3] <= 0) return null;

  /* 固有サイズを viewBox から与える。こうしておくと CSS 側の
     max-width:100% / height:auto で「小さい図はそのまま・大きい図は縮む」になる。
     width/height を消してしまうと固有サイズが無くなり 0x0 に潰れる。 */
  out.setAttribute("width", String(vb[2]));
  out.setAttribute("height", String(vb[3]));
  out.setAttribute("preserveAspectRatio", out.getAttribute("preserveAspectRatio") || "xMidYMid meet");
  out.setAttribute("xmlns", SVG_NS);
  out.setAttribute("role", "img");
  return out.outerHTML;
}

/* 問題に図版があれば、その描画ブロックを返す。無ければ空文字
   variant: "q"(出題・解説) / "review"(見直しコーナー。小さめに出す) */
function svgFigureHtml(q, variant){
  if(!q || !q.svg) return "";
  let clean = null;
  try{ clean = sanitizeSvg(q.svg); }
  catch(e){ clean = null; }
  if(!clean){
    /* v4.3 §5.2 エンジン側の防御: パース・描画に失敗しても落とさない。
       図なしで問題文のみ表示して続行し、気づけるようコンソールに警告を出す */
    console.warn(`[quest] 図版を描画できませんでした(id: ${q.id})。図なしで表示します。`);
    return "";
  }
  return `<div class="qfig ${variant === "review" ? "qfig-sm" : ""}">${clean}</div>`;
}


/* ===== src/ui/quiz.js ===== */
/* =====================================================================
   ui/quiz.js — 出題〜判定〜結果(ふくしゅう/じゅんび 共通)
   維持項目(fukushu §8): 段階ヒント2段階 / 誤答時即解説 / 見直しコーナー /
                        writeTip固定表示 / 記録・通信なし
   v4.1 記録2(承認済): セーブコードは結果画面に表示しない(おうちの人メニューへ)
   ===================================================================== */

let quiz = null;

/* ctx: { world, mode, buildSession, topbarHtml, initExtra, onAnswer, resultWorldHtml, goHome } */
function startQuiz(ctx, cat){
  const w = ctx.world;
  const qs = ctx.buildSession(w, cat, new Date());
  if(!qs.length){
    showToast("いま出せる問題がないみたい。ほかの間口をえらんでね。");
    ctx.goHome();
    return;
  }
  quiz = {
    ctx, cat: cat || null, qs, idx:0, input:"", hint:0, answered:false,
    results:[], combo:0, best:0,
    noHintStreak:0, noHintMaxStreak:0, hintCorrectCount:0, revengeWin:false,
    extra: ctx.initExtra ? ctx.initExtra(w) : {}
  };
  renderQ();
}

function renderQ(){
  const s = quiz, w = s.ctx.world, q = s.qs[s.idx];
  s.numeric = isNumericQuestion(q);
  const rail = s.qs.map((_, i) => {
    if(i < s.results.length) return `<span class="${s.results[i].ok?'on':'ng'}">${s.results[i].ok?'⭐':'💧'}</span>`;
    return `<span>⭐</span>`;
  }).join("");
  const catInfo = (w.cats || []).find(c => c.cat === q.cat);

  app.innerHTML = `
    ${bannerHtml()}
    <div class="topbar">
      <button class="quit-btn" id="quit">← やめる</button>
      ${s.ctx.topbarHtml(w)}
      <div class="combo">${s.combo>=2?`🔥${s.combo}れんぞく!`:""}</div>
    </div>
    <div class="rail">${rail}</div>
    <div class="qcard">
      ${q._revenge ? `<div class="revenge-badge">🔥 リベンジ問題!</div>` : ""}
      <div class="qnum">${catInfo?esc(catInfo.icon||""):""} ${esc(q.cat||"")} ・ だい ${s.idx+1} もん / ${s.qs.length}もん</div>
      <div class="qtext">${esc(q.q)}</div>
      ${svgFigureHtml(q, "q")}
      <div class="answer-row">
        ${s.numeric
          ? `<input type="text" class="answer-box" id="ansbox" inputmode="none" autocomplete="off" enterkeyhint="done">`
          : `<input type="text" class="answer-box answer-input" id="ansbox" placeholder="かんじ・かなで にゅうりょく" autocomplete="off" autocapitalize="off" enterkeyhint="done">`}
        <div class="unit">${esc(q.unit_label || "")}</div>
      </div>
      <div class="write-tip">✏️ ${esc(w.skin.writeTip || "まずノートに式を書こう。それが「さいしょの一手」!")}</div>
      <div class="hint-area" id="hintarea">
        <button class="hint-btn" id="hintbtn">💡 ヒントを見る</button>
      </div>
      <div id="fbarea"></div>
    </div>
    ${s.numeric ? `<div class="keypad" id="pad"></div>` : `<button class="next-btn submit-btn" id="submitBtn" disabled>こたえあわせ</button>`}`;

  bindBanner();
  document.getElementById("quit").addEventListener("click", () => { quiz = null; s.ctx.goHome(); });
  document.getElementById("hintbtn").addEventListener("click", showHint);

  /* 数字・テキスト共通: 物理キーボード(PC)から直接入力できるようにinputを購読 */
  const input = document.getElementById("ansbox");
  input.addEventListener("input", () => { quiz.input = input.value; updateAns(); });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter" && quiz.input && quiz.input.trim() && !quiz.answered) check();
  });

  if(s.numeric){ renderPad(); updateAns(); }
  else { document.getElementById("submitBtn").addEventListener("click", check); input.focus(); }
}

function renderPad(){
  const pad = document.getElementById("pad");
  const keys = ["7","8","9","⌫","4","5","6","/","1","2","3",".","0"];
  pad.innerHTML = keys.map(k => `<button class="key ${["⌫","/","."].includes(k)?"fn":""}" data-k="${k}">${k}</button>`).join("")
    + `<button class="key go" id="gobtn">こたえあわせ</button>`;
  pad.querySelectorAll(".key[data-k]").forEach(b => b.addEventListener("click", () => tapKey(b.dataset.k)));
  document.getElementById("gobtn").addEventListener("click", check);
}

/* キーパッドのタップは実際の<input>の値を書き換える(PCからの直接タイプと同じ経路に統一) */
function tapKey(k){
  if(quiz.answered) return;
  const input = document.getElementById("ansbox");
  if(k === "⌫") input.value = input.value.slice(0,-1);
  else if(input.value.length < 8) input.value += k;
  quiz.input = input.value;
  updateAns();
}

function updateAns(){
  const box = document.getElementById("ansbox");
  if(!box) return;
  box.classList.toggle("filled", !!quiz.input);
  box.disabled = quiz.answered;
  if(quiz.numeric){
    const go = document.getElementById("gobtn");
    if(go) go.disabled = !quiz.input || quiz.answered;
  } else {
    const btn = document.getElementById("submitBtn");
    if(btn) btn.disabled = !quiz.input || !quiz.input.trim() || quiz.answered;
  }
}

function showHint(){
  const q = quiz.qs[quiz.idx];
  const area = document.getElementById("hintarea");
  quiz.hint++;
  const bubbles = [];
  if(quiz.hint >= 1) bubbles.push(`<div class="hint-bubble">💡 <b>考え方</b>: ${esc(q.h1)}</div>`);
  if(quiz.hint >= 2) bubbles.push(`<div class="hint-bubble">🧮 <b>式</b>: ${esc(q.h2)}</div>`);
  const btnLabel = quiz.hint === 1 ? "💡 もうひとつヒント(式)" : "";
  area.innerHTML = bubbles.join("") + (btnLabel ? `<div style="margin-top:8px"><button class="hint-btn" id="hintbtn">${btnLabel}</button></div>` : "");
  const nb = document.getElementById("hintbtn");
  if(nb) nb.addEventListener("click", showHint);
}

function check(){
  const s = quiz, w = s.ctx.world, q = s.qs[s.idx];
  if(s.answered || !s.input) return;
  s.answered = true;

  const ok = answerMatches(q, s.input);
  s.results.push({ q, ok, my: s.input, hintUsed: s.hint });

  /* 世界別の前後比較(封印解除の検出など)は onAnswer に委ねる */
  const hook = s.ctx.onAnswer ? s.ctx.onAnswer(w, q, ok, s, "before") : null;

  /* §4.1: 解答確定ごとに state を全量書き込み */
  recordAnswer(w.state, q, ok, s.ctx.mode, new Date());
  saveState(w.subject, w.state);

  const after = s.ctx.onAnswer ? s.ctx.onAnswer(w, q, ok, s, "after", hook) : { banners: "" };

  if(ok){
    s.combo++; s.best = Math.max(s.best, s.combo);
    if(s.hint === 0){ s.noHintStreak++; s.noHintMaxStreak = Math.max(s.noHintMaxStreak, s.noHintStreak); }
    else { s.noHintStreak = 0; s.hintCorrectCount++; }
    if(q._revenge) s.revengeWin = true;
  } else {
    s.combo = 0; s.noHintStreak = 0;
  }

  const fb = document.getElementById("fbarea");
  const last = s.idx === s.qs.length - 1;
  if(ok){
    fb.innerHTML = `<div class="fb ok">
      <div class="fb-head">${(after && after.okHead) || "⭕ せいかい!"} ${esc(pick(w.skin.praise))}</div>
      ${(after && after.banners) || ""}
      ${s.hint === 0 ? "ノーヒントはえらい!" : esc(w.skin.hintPraise)}
      <button class="next-btn" id="next">${last?"けっかを見る 🏁":"つぎの問題へ ▶"}</button></div>`;
  } else {
    /* 誤答時の即解説。図が本質の問題は解説でも図を再掲する(§5.2) */
    fb.innerHTML = `<div class="fb ng"><div class="fb-head">❌ ざんねん…</div>
      正解は <b>${esc(q.ans[0])}${esc(q.unit_label||"")}</b>。${svgFigureHtml(q, "review")}<br>📖 ${esc(q.exp)}<br>${esc(pick(w.skin.cheer))}
      <button class="next-btn" id="next">${last?"けっかを見る 🏁":"つぎの問題へ ▶"}</button></div>`;
  }
  updateAns();
  document.getElementById("next").addEventListener("click", () => {
    if(last) renderResult();
    else { s.idx++; s.input=""; s.hint=0; s.answered=false; renderQ(); }
  });
  fb.scrollIntoView({ behavior:"smooth", block:"end" });
}

function renderResult(){
  const s = quiz, w = s.ctx.world;
  const nOK = s.results.filter(r => r.ok).length, n = s.results.length;
  const stars = nOK===n ? 3 : nOK>=n-2 ? 2 : nOK>=Math.ceil(n/2) ? 1 : 0;
  const emoji = stars===3?"🏆":stars===2?"🎉":stars===1?"💪":"🌱";
  const title = stars===3?"パーフェクト!!":stars===2?"あと少しで満点!":stars===1?"いいペース!":"ここからスタート!";
  const misses = s.results.filter(r => !r.ok);
  s.perfectStage = (nOK === n);

  const stats = {
    noHintMaxStreak: s.noHintMaxStreak,
    hintCorrectCount: s.hintCorrectCount,
    revengeWin: s.revengeWin,
    perfectStage: s.perfectStage
  };
  const earned = earnedTitles(w.skin, stats, w.state.xp);

  flushAllStates();                                  // §4.1 セッション終了時の書き込み

  app.innerHTML = `
    ${bannerHtml()}
    <div class="res-head"><div class="res-emoji">${emoji}</div><div class="res-title">${title}</div></div>
    <div class="res-score"><b>${nOK}</b> / ${n} もん せいかい</div>
    <div class="res-stars">${"🌟".repeat(stars)}${"☆".repeat(3-stars)}</div>
    ${s.best>=3?`<div class="res-score" style="font-size:15px">🔥 さいだい ${s.best}れんぞく正解!</div>`:""}

    ${s.ctx.resultWorldHtml ? s.ctx.resultWorldHtml(w, s) : ""}

    ${earned.length ? `<div class="title-wrap">${earned.map(t=>`<span class="title-badge">🏅 ${esc(t.name)}</span>`).join("")}</div>` : ""}

    ${misses.length?`<div class="review-head">📖 見直しコーナー(ノートで解き直そう)</div>`:""}
    ${misses.map(r=>`<div class="review">
        <div class="rq">Q. ${esc(r.q.q)}</div>
        ${svgFigureHtml(r.q, "review")}
        <div class="ra"><span class="miss">きみの答え: ${esc(r.my)}</span> → 正解: <b>${esc(r.q.ans[0])}${esc(r.q.unit_label||"")}</b><br>${esc(r.q.exp)}</div>
      </div>`).join("")}
    <div class="res-btns">
      <button class="retry" id="retry">もう一回 🔁</button>
      <button class="gohome" id="home">ホームへ</button>
    </div>`;
  bindBanner();
  document.getElementById("retry").addEventListener("click", () => startQuiz(s.ctx, s.cat));
  document.getElementById("home").addEventListener("click", () => { quiz = null; s.ctx.goHome(); });
}

/* ---------- クイズ用コンテキスト ---------- */
function fukushuCtx(subject){
  const w = WORLDS[subject];
  return {
    world: w,
    mode: "fukushu",
    buildSession: (world, cat, today) => buildSessionFukushu(world.liveQs, world.state, cat, today),
    topbarHtml: (world) => {
      const map = world.skin.map;
      const i = nodeIndexForXp(world.state.xp, map);
      const pct = Math.round((i/(map.nodes.length-1))*100);
      return `<div class="journey-mini">
        <span class="em">${esc(map.nodes[i].emoji)}</span>
        <div class="journey-mini-track"><div class="journey-mini-fill" style="width:${pct}%"></div></div>
      </div>`;
    },
    initExtra: (world) => ({ startNodeIdx: nodeIndexForXp(world.state.xp, world.skin.map) }),
    onAnswer: (world, q, ok, s, phase) => phase === "after" ? { banners:"", okHead:"⭕ せいかい!" } : null,
    resultWorldHtml: (world, s) => {
      const nodes = world.skin.map.nodes;
      const newIdx = nodeIndexForXp(world.state.xp, world.skin.map);
      const startIdx = s.extra.startNodeIdx;
      const moved = newIdx - startIdx;
      const atGoal = newIdx >= nodes.length - 1;
      return `<div class="journey-card">
        <div class="journey-move">${moved>0?`${moved}歩 すすんだ!`:"今回はたびの歩数なし。また次回!"}</div>
        <div class="journey-nodes">
          <span>${esc(nodes[startIdx].emoji)}</span>
          ${moved>0?`<span class="journey-arrow">→</span><span>${esc(nodes[newIdx].emoji)}</span>`:""}
        </div>
        <div class="journey-newname">いま: ${esc(nodes[newIdx].name)}${atGoal?" 🎉":""}</div>
        ${atGoal ? `<div class="map-goal" style="margin-top:8px">${esc(world.skin.map.goalMessage||"")}</div>` : ""}
      </div>`;
    },
    goHome: () => renderSubjectHome(subject)
  };
}

let bossOneshotLine = null;      // 回解放・新ボス登場など、1回だけ表示する台詞

function yWorld(){ return WORLDS.Y; }
function yKeys(){ const w = yWorld(); return unlockedKeys(w.liveQs, w.cats, w.state.boxes); }
function yUnlockedQs(){ const w = yWorld(); return unlockedQsOf(w.liveQs, yKeys()); }
function ySubjectMastery(cat){
  const w = yWorld();
  return masteryPctOf(yUnlockedQs().filter(q => q.cat === cat), w.state.boxes);
}
function yOverallMastery(){ return masteryPctOf(yUnlockedQs(), yWorld().state.boxes); }
function yHP(){ return bossHP(yUnlockedQs(), yWorld().state.boxes); }
function ySealBroken(cat){ return ySubjectMastery(cat) >= SEAL_THRESHOLD; }
function yAllSealsBroken(){ const w = yWorld(); return w.cats.length>0 && w.cats.every(c => ySealBroken(c.cat)); }

    ${msg ? `<div class="code-msg ${msg.ok?'ok':'ng'}">${esc(msg.text)}</div>` : ""}

      return;

    unlockKai(ch.dataset.cat, Number(ch.dataset.kai));
    bossOneshotLine = (yWorld().skin.boss && yWorld().skin.boss.lines && yWorld().skin.boss.lines.powerUp)

    renderBossHome();
  }));
  document.getElementById("logBtn").addEventListener("click", () => renderBossLog());
  document.getElementById("parentMenuBtn").addEventListener("click", () => renderParentMenu());

/* ---------- サイクル交代(v4.1 §7.1) ----------
   push経由(起動時検出)・おうちの人メニュー経由のどちらも必ずこの1本を通す(記録漏れ防止) */
function proceedCycleSwitch(newBank){
  const w = yWorld();
  /* (a) 討伐記録を追記。mastery は未解放の回も分母に含む全問題ベース(yoshu §4) */
  saveBossLogEntry(buildBossLogEntry(w.skin, w.bank, w.liveQs, w.state.boxes));
  /* (b) 進捗と解放状態をリセット */
  w.bank = newBank;
  deriveWorld(w);
  w.state = emptyState(newBank.bankVersion);
  saveState("Y", w.state);
  clearUnlocks();
  /* (c) 新バンクを採用し、現在有効な bank_Y を quest_bank_Y にミラー(§7.1 実装要件) */
  mirrorYBank(newBank);
  const boss = w.skin.boss || {};
  bossOneshotLine = (boss.lines && boss.lines.appear) || "あらたなボスが あらわれた!";
}

/* 現在有効な bank_Y を常にミラーしておく(拒否時に旧バンクで継続するため) */
function mirrorYBank(bank){
  writeAdopted(keyBank("Y"), bank, BUILTIN_BANKS.Y.bankVersion);
  WORLDS.Y.bankSource = bank.bankVersion === BUILTIN_BANKS.Y.bankVersion ? "builtin" : "local";
}

function renderCycleSwitchConfirm(newBank, origin){
  quiz = null;
  const w = yWorld();
  const bossName = (w.skin.boss && w.skin.boss.name) || "-";
  const oldMastery = masteryPctOf(w.liveQs, w.state.boxes);

  app.innerHTML = `
    <div class="home-title" style="font-size:22px">⚠️ 新しいボスが あらわれた!</div>
    <div class="confirm-card">
      <p>いまのボス「<b>${esc(bossName)}</b>」との勝負を終わりにして、新しいボスに挑む?</p>
      <p style="margin-top:10px;">いまの進捗(マスター率 <b>${oldMastery}%</b>)はリセットされるよ。討伐のきろくには自動で記録されます。</p>
      <p style="margin-top:10px;">新しいバンク: <b>${esc(newBank.bankVersion||"-")}</b>(テスト日: ${esc(newBank.testDate||"-")})</p>
      <div class="confirm-btns">
        <button class="code-btn" id="confirmYes">うん、挑む!</button>
        <button class="reset-bank-btn" id="confirmNo" style="margin-top:0;">まだ やめておく</button>
      </div>
    </div>`;

  document.getElementById("confirmYes").addEventListener("click", () => {
    proceedCycleSwitch(newBank);

    else { VIEW = { tab:"junbi", subject:"Y" }; saveLastView(); renderBossHome(); }

  document.getElementById("confirmNo").addEventListener("click", () => {
    /* 拒否: 現行バンクで継続。記録は書き換えないので次回起動時に再度確認される(§7.1-3) */
    pendingCycleSwitch = null;
    if(origin === "menu") renderParentMenu({ target:"bank", subject:"Y", ok:false, text:"交代をキャンセルしました。" });
    else { VIEW = { tab:"junbi", subject:"Y" }; saveLastView(); renderBossHome(); }

/* ---------- クイズ用コンテキスト ---------- */
function junbiCtx(){
  return {
    world: yWorld(),
    mode: "yoshu",
    buildSession: (world, cat, today) => buildSessionYoshu(yUnlockedQs(), world.state, cat, today),
    topbarHtml: (world) => {
      const hp = yHP();
      const emoji = (world.skin.boss && world.skin.boss.emoji) || "👑";
      return `<div class="hp-mini">
        <span class="em">${esc(emoji)}</span>
        <div class="hp-mini-track"><div class="hp-mini-fill" style="width:${Math.max(hp,0)}%"></div></div>
      </div>`;
    },
    initExtra: () => {
      const start = {};
      yWorld().cats.forEach(c => { start[c.cat] = ySubjectMastery(c.cat); });
      return { startOverallMastery: yOverallMastery(), startSubjMastery: start, sealBreaks: [] };
    },
    onAnswer: (world, q, ok, s, phase, pre) => {
      if(phase === "before") return { preSubjPct: ySubjectMastery(q.cat) };
      const postSubjPct = ySubjectMastery(q.cat);
      const boss = world.skin.boss || {};
      let banners = "";
      if(!ok) return { banners:"", okHead:"⚔️ ヒット!" };

      const dmgLine = pick((boss.lines && boss.lines.damage) || []);
      if(dmgLine) banners += `<div class="boss-react">${esc(boss.emoji||"")} 「${esc(dmgLine)}」</div>`;
      if(q._revenge){
        banners += `<div class="counter-banner">🔥 ${esc((boss.lines&&boss.lines.counter) || "カウンター攻撃! リベンジ成功でクリティカル!!")}</div>`;
      }
      if(pre && pre.preSubjPct < SEAL_THRESHOLD && postSubjPct >= SEAL_THRESHOLD){
        s.extra.sealBreaks.push(q.cat);
        banners += `<div class="sealbreak-banner">✨ ${esc((boss.lines&&boss.lines.sealBreak) || "封印がひとつ解けた!")}(${esc(q.cat)})</div>`;
      }
      return { banners, okHead:"⚔️ ヒット!" };
    },
    resultWorldHtml: (world, s) => {
      const boss = world.skin.boss || {};
      const hpBefore = 100 - s.extra.startOverallMastery;
      const hpAfter = yHP();
      const keys = yKeys();
      const allOpen = allKaisUnlocked(world.liveQs, keys);
      const justDefeated = hpBefore > 0 && hpAfter <= 0 && allOpen;   // 討伐ガード(yoshu §4)
      const guarded = hpAfter <= 0 && !allOpen;
      const sealBreaks = [...new Set(s.extra.sealBreaks)];
      return `<div class="boss-card ${justDefeated?'defeated':''}">
          <div class="boss-emoji-big">${justDefeated ? "🏆" : esc(boss.emoji||"👑")}</div>
          <div class="boss-name">${esc(boss.name||"")}</div>
          <div class="hp-label">HPの変化</div>
          <div class="hp-bar-track"><div class="hp-bar-fill" style="width:${Math.max(hpAfter,0)}%"></div></div>
          <div class="hp-text">${Math.max(hpBefore,0)} → ${Math.max(hpAfter,0)} / 100</div>
          ${justDefeated ? `<div class="defeat-banner">🎉🎊 ${esc((boss.lines&&boss.lines.defeat) || "討伐した!")} 🎊🎉</div>` : ""}
          ${guarded ? `<div class="defeat-banner">まだ封印された力が残っておるぞ?(習ったら次の回を解放しよう)</div>` : ""}
        </div>
        ${sealBreaks.length ? `<div class="sealbreak-banner">✨ ${esc((boss.lines&&boss.lines.sealBreak) || "封印がひとつ解けた!")}(${sealBreaks.map(esc).join("・")})</div>` : ""}`;
    },
    goHome: () => renderBossHome()
  };
}

/* =====================================================================
   ui/parent.js — おうちの人メニュー(共通1箇所)
   仕様: v4.1 §2 / §3.1 / §4.4 / §6、fukushu §7(2経路更新・doApply共通)
   ・バンク差し替えは科目(M/R/S/K/Y)を選択、スキン差し替えは枠(M/R/S/K/ボス)を選択
   ・セーブコード画面はここに置く(子供の通常導線からは外す)
   ===================================================================== */

const BANK_SLOTS = ["M","R","S","K","Y"];
const SKIN_SLOTS = ["M","R","S","K","BOSS"];
const SKIN_SLOT_LABEL = { M:"算数(ふくしゅう)", R:"理科(ふくしゅう)", S:"社会(ふくしゅう)", K:"国語(ふくしゅう)", BOSS:"じゅんび(ボス)" };

let parentBankSlot = "M";
let parentSkinSlot = "M";

function skinWorldOf(slot){ return slot === "BOSS" ? WORLDS.Y : WORLDS[slot]; }

function renderParentMenu(msg){
  quiz = null;
  const bankMsg = msg && msg.target === "bank" ? msg : null;
  const skinMsg = msg && msg.target === "skin" ? msg : null;

  app.innerHTML = `
    ${bannerHtml()}
    <div class="topbar"><button class="quit-btn" id="back">← もどる</button></div>
    <div class="home-title" style="font-size:22px">⚙️ おうちの人メニュー</div>
    <div class="home-sub">バンク(問題)・スキン(見た目)の更新とセーブコードはここから。子どもの画面には出てきません。</div>

    <div class="map-card">
      <div class="map-label">いまのバンク</div>
      <div class="bank-status">
        ${BANK_SLOTS.map(s => {
          const w = WORLDS[s];
          return `<div>${esc(SUBJECT_LABEL[s])}(${s}): <b>${esc(w.bank.bankVersion||"-")}</b>
            ${w.allQs.length}問(有効 ${w.liveQs.length})・${w.bankSource==="local"?"端末に投入":"内蔵"}</div>`;
        }).join("")}
      </div>
    </div>

    <div class="code-card">
      <div class="code-label">📚 バンクを更新する</div>
      <select id="bankSlot" class="slot-select">
        ${BANK_SLOTS.map(s => `<option value="${s}" ${s===parentBankSlot?"selected":""}>${esc(SUBJECT_LABEL[s])}(${s})</option>`).join("")}
      </select>
      <div class="code-label" style="margin-top:12px;">📂 バンクJSONファイルを開く(かんたん・おすすめ)</div>
      <input type="file" id="bankFile" accept=".json,application/json,text/plain" class="bank-file">
      <div class="code-label" style="margin-top:14px;">📋 またはJSON全文を貼り付け</div>
      <textarea id="bankPaste" class="bank-paste" rows="6" placeholder="ここにバンクJSON全文を貼り付け"></textarea>
      <div class="code-row" style="margin-top:10px;">
        <button class="code-btn" id="applyBankBtn" style="flex:1;">バンクを更新する</button>
      </div>
      ${bankMsg ? `<div class="code-msg ${bankMsg.ok?'ok':'ng'}">${esc(bankMsg.text)}</div>` : ""}
    </div>
    <button class="reset-bank-btn" id="resetBankBtn">🔄 えらんだ科目を内蔵バンクに戻す</button>

    <div class="code-card" style="margin-top:20px;">
      <div class="code-label">🎭 スキンを更新する</div>
      <select id="skinSlot" class="slot-select">
        ${SKIN_SLOTS.map(s => `<option value="${s}" ${s===parentSkinSlot?"selected":""}>${esc(SKIN_SLOT_LABEL[s])}</option>`).join("")}
      </select>
      <div class="skin-status" id="skinStatus"></div>
      <div class="code-label" style="margin-top:12px;">📂 スキンJSONファイルを開く</div>
      <input type="file" id="skinFile" accept=".json,application/json,text/plain" class="bank-file">
      <div class="code-label" style="margin-top:14px;">📋 またはJSON全文を貼り付け</div>
      <textarea id="skinPaste" class="bank-paste" rows="5" placeholder="ここにスキンJSON全文を貼り付け"></textarea>
      <div class="code-row" style="margin-top:10px;">
        <button class="code-btn" id="applySkinBtn" style="flex:1;">スキンを更新する</button>
      </div>
      ${skinMsg ? `<div class="code-msg ${skinMsg.ok?'ok':'ng'}">${esc(skinMsg.text)}</div>` : ""}
    </div>
    <button class="reset-bank-btn" id="resetSkinBtn">🔄 えらんだ枠を内蔵スキンに戻す</button>

    <button class="reset-bank-btn" id="codeScreenBtn" style="margin-top:20px;">🔑 セーブコード(発行・読み込み)</button>`;

  bindBanner();
  document.getElementById("back").addEventListener("click", () => renderCurrentView());
  document.getElementById("codeScreenBtn").addEventListener("click", () => renderSaveCodeScreen());

  const slotSel = document.getElementById("bankSlot");
  slotSel.addEventListener("change", () => { parentBankSlot = slotSel.value; });
  const skinSel = document.getElementById("skinSlot");
  const refreshSkinStatus = () => {
    const w = skinWorldOf(skinSel.value);
    document.getElementById("skinStatus").innerHTML =
      `いま: <b>${esc(w.skin.skinVersion||"-")}</b>(${esc(w.skin.title||"")})・${w.skinSource==="local"?"端末に投入":"内蔵"}`;
  };
  skinSel.addEventListener("change", () => { parentSkinSlot = skinSel.value; refreshSkinStatus(); });
  refreshSkinStatus();

  /* ---------- バンク更新(貼り付け・ファイルの2経路とも doApplyBank を通る) ---------- */
  const doApplyBank = (text) => {
    const sub = parentBankSlot;
    const w = WORLDS[sub];
    const result = validateBankPaste(text, sub, w.allQs.map(q => q.id));
    if(!result.ok){
      renderParentMenu({ target:"bank", ok:false, text:"❌ 更新できませんでした: " + result.reason });
      return;
    }
    if(sub === "Y" && result.bank.bankVersion !== w.bank.bankVersion){
      /* サイクル交代はメニュー経由でも §7.1 と同一処理を通す(記録漏れ防止) */
      renderCycleSwitchConfirm(result.bank, "menu");
      return;
    }
    applyBankToWorld(sub, result.bank);
    /* v4.3 §6: 不正な図版はバンクを拒否せず破棄して採用する。破棄したことは伝える */
    const svgNote = (result.svgWarnings && result.svgWarnings.length)
      ? `　⚠️ 図版${result.svgWarnings.length}件を安全のため取り除きました(図なしで出題されます): ${result.svgWarnings.join(" / ")}`
      : "";
    renderParentMenu({ target:"bank", ok:true, text: (storageAvailable
      ? "✅ 更新しました!(この端末に保存されました)"
      : "✅ 今回のセッションで更新しました(保存はされていません。次回はまた読み込んでね)") + svgNote });
  };
  document.getElementById("applyBankBtn").addEventListener("click", () => doApplyBank(document.getElementById("bankPaste").value));
  document.getElementById("bankFile").addEventListener("change", ev => readFileInto(ev, doApplyBank, "bank"));

  document.getElementById("resetBankBtn").addEventListener("click", () => {
    const sub = parentBankSlot;
    const builtin = BUILTIN_BANKS[sub];
    if(sub === "Y" && builtin.bankVersion !== WORLDS.Y.bank.bankVersion){
      renderCycleSwitchConfirm(builtin, "menu");
      return;
    }
    clearAdopted(keyBank(sub));
    applyBankToWorld(sub, builtin, true);
    renderParentMenu({ target:"bank", ok:true, text:`🔄 ${SUBJECT_LABEL[sub]}を内蔵バンクに戻しました。` });
  });

  /* ---------- スキン更新 ---------- */
  const doApplySkin = (text) => {
    const slot = parentSkinSlot;
    const result = validateSkinPaste(text, slot === "BOSS" ? "boss" : "fukushu");
    if(!result.ok){
      renderParentMenu({ target:"skin", ok:false, text:"❌ 更新できませんでした: " + result.reason });
      return;
    }
    const w = skinWorldOf(slot);
    w.skin = result.skin;
    w.skinSource = "local";
    writeAdopted(keySkin(slot), result.skin, BUILTIN_SKINS[slot].skinVersion);
    renderParentMenu({ target:"skin", ok:true, text: storageAvailable
      ? "✅ スキンを更新しました!(この端末に保存されました)"
      : "✅ 今回のセッションでスキンを更新しました(保存はされていません)。" });
  };
  document.getElementById("applySkinBtn").addEventListener("click", () => doApplySkin(document.getElementById("skinPaste").value));
  document.getElementById("skinFile").addEventListener("change", ev => readFileInto(ev, doApplySkin, "skin"));

  document.getElementById("resetSkinBtn").addEventListener("click", () => {
    const slot = parentSkinSlot;
    const w = skinWorldOf(slot);
    clearAdopted(keySkin(slot));
    w.skin = BUILTIN_SKINS[slot];
    w.skinSource = "builtin";
    renderParentMenu({ target:"skin", ok:true, text:`🔄 ${SKIN_SLOT_LABEL[slot]}を内蔵スキンに戻しました。` });
  });
}

function readFileInto(ev, cb, what){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload  = () => cb(String(rd.result));
  rd.onerror = () => renderParentMenu({ target:what, ok:false, text:"❌ ファイルを読み込めませんでした。" });
  rd.readAsText(f);
}

/* バンクを世界へ適用。進捗は保持し、増えた問題は未出題として扱う(§4.2) */
function applyBankToWorld(sub, bank, isBuiltinReset){
  const w = WORLDS[sub];
  w.bank = bank;
  deriveWorld(w);
  w.state = reconcileState(w.state, bank);
  saveState(sub, w.state);
  if(sub === "Y"){
    mirrorYBank(bank);                                   // §7.1 実装要件
  } else if(isBuiltinReset){
    w.bankSource = "builtin";
  } else {
    writeAdopted(keyBank(sub), bank, BUILTIN_BANKS[sub].bankVersion);
    w.bankSource = bank.bankVersion === BUILTIN_BANKS[sub].bankVersion ? "builtin" : "local";
  }
}

/* ---------- セーブコード画面(§4.4) ---------- */
let codeScreenSubject = "M";

function renderSaveCodeScreen(msg){
  quiz = null;
  const sub = codeScreenSubject;
  const w = WORLDS[sub];
  const mode = sub === "Y" ? "yoshu" : "fukushu";
  const code = makeSaveCode(w.allQs, w.state.boxes, w.state.xp, mode);

  app.innerHTML = `
    ${bannerHtml()}
    <div class="topbar"><button class="quit-btn" id="back">← おうちの人メニューへ</button></div>
    <div class="home-title" style="font-size:22px">🔑 セーブコード</div>
