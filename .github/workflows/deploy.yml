name: build & deploy to Pages

# spec_quest_v4_1.md §7: push(main) → node build.mjs → dist/ を Pages にデプロイ
# Pages の source は「GitHub Actions」に設定済みであること

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイはキャンセルしない(公開物が中途半端にならないように)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ビルド(依存パッケージなし)
        run: node build.mjs

      - name: 検収チェックリストの自動テスト(§9)
        run: node test/run-tests.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
